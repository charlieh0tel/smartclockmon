[workspace]
members = [
    "crates/smartclock",
    "crates/smartclock-cli",
    "crates/smartclockd",
    "crates/smartclockmon",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Christopher Hoover <ch@murgatroid.com>"]
license = "GPL-3.0-or-later"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
doc_markdown = "warn"
enum_glob_use = "deny"
todo = "warn"

