# Do not add default-members.  CI runs a bare `cargo test`, which covers
# every member only while this is absent; one was added once and cut the
# run from 76 tests to 0, exit 0, CI green while testing nothing.
[workspace]
members = [
    "crates/smartclock",
    "crates/smartclock-cli",
    "crates/smartclock-exporter",
    "crates/smartclock-http",
    "crates/smartclock-sim",
    "crates/smartclock-web",
    "crates/smartclockd",
    "crates/smartclockmon",
]
resolver = "3"

[workspace.package]
version = "0.6.5"
edition = "2024"
rust-version = "1.89"
authors = ["Christopher Hoover <ch@murgatroid.com>"]
license = "GPL-3.0-or-later"

# Stripped in the packaged build: lintian objects to unstripped
# binaries, and debug symbols triple the size of a package whose point
# is to sit on a machine and log.
[profile.release]
strip = "symbols"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
doc_markdown = "warn"
enum_glob_use = "deny"
todo = "warn"

