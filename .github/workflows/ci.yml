name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # The shared definition, so this repo's CI matches the others.
    #
    #   fmt-toolchain  empty, not nightly.  rust-toolchain.toml pins the
    #                  compiler and the workflow now reads the channel out
    #                  of it, so the version no longer lives in two places;
    #                  emptying this makes the fmt job resolve the same way
    #                  instead of fetching a nightly for rustfmt alone.
    #   audit          off here, not because auditing does not matter, but
    #                  because audit.yml already does it on the schedule a
    #                  called workflow cannot have -- see the note there.
    #   check-args     --all-targets, or clippy never sees the tests,
    #                  which are the larger half of this workspace
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@v1
    with:
      # serialport needs libudev on Linux.
      build-deps: "libudev-dev"
      fmt-toolchain: ""
      audit: false
      check-args: "--workspace --all-targets --all-features"
