name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # The shared definition, so this repo's CI matches the others.  The
    # inputs restore what the defaults would drop:
    #
    #   toolchain      pinned, rather than whatever stable is that week
    #   fmt-toolchain  the same, because nightly rustfmt formats
    #                  differently and would fail a check that "make
    #                  fmt" had just satisfied
    #   check-args     --all-targets, or clippy never sees the tests,
    #                  which are the larger half of this workspace
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@main
    with:
      # serialport needs libudev on Linux.
      build-deps: "libudev-dev"
      toolchain: "1.89.0"
      fmt-toolchain: "1.89.0"
      check-args: "--workspace --all-targets --all-features"
