name: release

on:
  push:
    tags: ["v*"]

jobs:
  deb:
    # No `package:` input.  With one, the shared workflow builds only
    # that crate, and this package ships three binaries from three
    # crates: cargo-deb then fails with "Static file asset has not been
    # built".  Left empty, it builds the whole workspace and cargo-deb
    # picks the single crate carrying [package.metadata.deb].
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job.  At workflow level it would also be granted to
    # the dispatch job below, which writes nothing here.
    permissions:
      contents: write
    with:
      # serialport needs libudev on Linux.
      build-deps: "libudev-dev"
      # No toolchain input: rust-build-deb reads the channel out of
      # rust-toolchain.toml itself now, so the published package is still
      # built by the compiler this repo names, without the version having
      # to be kept equal in two places.

  # The release the deb job created carries only a compare link; its
  # notes are the changelog entry the release commit wrote, so the page
  # says what changed without anyone pasting it in.
  notes:
    needs: deb
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./packaging/release-notes.sh > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  # The Windows programs, zipped onto the release the deb job created.
  # Unsupported, as their README and the release notes say.
  windows:
    needs: deb
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --release --locked --workspace --bins
      - name: Attach the zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="smartclockmon-${GITHUB_REF_NAME#v}-windows-x86_64"
          packaging/bundle.sh "dist/$name" packaging/windows-release.txt "$GITHUB_SHA"
          (cd dist && 7z a -tzip "$name.zip" "$name")
          gh release upload "$GITHUB_REF_NAME" "dist/$name.zip"

  trigger-apt-repo:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      # workflow_dispatch, not repository_dispatch: the token then needs
      # Actions: write on apt-repo instead of Contents: write, which could
      # push a commit to the workflow that runs with the GPG signing key.
      - name: Trigger APT repo rebuild
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: gh workflow run update-repo.yml -R charlieh0tel/apt-repo
