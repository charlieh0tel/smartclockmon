name: release

on:
  push:
    tags: ["v*"]

jobs:
  deb:
    # No `package:` input.  With one, the shared workflow builds only
    # that crate, and this package ships three binaries from three
    # crates: cargo-deb then fails with "Static file asset has not been
    # built".  Left empty, it builds the whole workspace and cargo-deb
    # picks the single crate carrying [package.metadata.deb].
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job.  At workflow level it would also be granted to
    # the dispatch job below, which writes nothing here.
    permissions:
      contents: write
    with:
      # serialport needs libudev on Linux.
      build-deps: "libudev-dev"
      # No toolchain input: rust-build-deb reads the channel out of
      # rust-toolchain.toml itself now, so the published package is still
      # built by the compiler this repo names, without the version having
      # to be kept equal in two places.

  trigger-apt-repo:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger APT repo rebuild
        # Pinned to a commit, as the shared workflows now are: a tag can
        # be moved to point at anything, and this step is handed a token
        # that can write to the APT repository.
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
        with:
          token: ${{ secrets.APT_REPO_TOKEN }}
          repository: charlieh0tel/apt-repo
          event-type: update-apt-repo
