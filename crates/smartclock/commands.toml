# SmartClock command table.
#
# Generated into Rust by build.rs.  Do not add commands to Rust source;
# add them here so the two dialects stay diffable against the manuals.
#
# class:     query      read-only, always permitted
#            control    changes receiver state, requires config opt-in
#            dangerous  can strand the link or wipe configuration
#
# "query" means read-only, not harmless.  An event register clears when
# it is read, so :STATus:...:EVENt? and the bare group forms the
# firmware also accepts -- :STATus:OPERation?, :STATus:QUEStionable? --
# destroy what they report.  The daemon never polls one; they are here
# so a deliberate acknowledgement has a spelling, and so a sweep can be
# told to leave them alone.  One sweep was not, and cleared a Z3805A's
# latched events.
# response:  parser name; see crates/smartclock/src/parse
# models:    which receivers expose this command
# evidence:  how far the entry has been confirmed --
#            "manual"   transcribed from the document only
#            "firmware" every keyword found in the firmware's own
#                       keyword table, so the spelling is right even
#                       though no such receiver has been on the line
#            "hardware" the receiver answered it
# argument:  what the command's argument may be, when it takes one.
#            Absent means a query takes none and a setter takes anything
#            the character whitelist allows.  Given, it is checked before
#            the command reaches the receiver, so the string path
#            validates what the typed Control handle already does.
# cite:      page in the dialect's manual
#
# Sources: hp58503 from 097-59551-02 chapter 5, z3801 from 097-z3801-01
# table 4-2, plus commands found by sweeping the receiver with candidate
# paths built from the firmware keyword table.  Those are cited as
# discovered and are marked for the 58503A only, since no other model
# has been swept.
#
# The 59551A-only PULSe, SENSe:TSTamp and FORMat subsystems are omitted.
# We have no such hardware, so entries for them could never be verified.

schema = 4

