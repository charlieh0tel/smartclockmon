# SmartClock command table.
#
# Generated into Rust by build.rs.  Do not add commands to Rust source;
# add them here so the two dialects stay diffable against the manuals.
#
# class:     query      read-only, always permitted
#            control    changes receiver state, requires config opt-in
#            dangerous  can strand the link or wipe configuration
# response:  parser name; see crates/smartclock/src/parse
# models:    which receivers expose this command
# evidence:  how far the entry has been confirmed --
#            "manual"   transcribed from the document only
#            "firmware" every keyword found in the firmware's own
#                       keyword table, so the spelling is right even
#                       though no such receiver has been on the line
#            "hardware" the receiver answered it
# cite:      page in the dialect's manual
#
# Sources: hp58503 from 097-59551-02 chapter 5, z3801 from 097-z3801-01
# table 4-2.
#
# The 59551A-only PULSe, SENSe:TSTamp and FORMat subsystems are omitted.
# We have no such hardware, so entries for them could never be verified.

schema = 2

