[package]
name = "smartclockd"
description = "Logging daemon for a SmartClock receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.37"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smartclock = { path = "../smartclock" }
smartclock-log = { path = "../smartclock-log" }

[dev-dependencies]
smartclock-sim = { path = "../smartclock-sim" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
signal-hook = "0.4.4"

# Packaging lives on this crate because cargo-deb wants a single
# package, and the daemon is what the deb exists to install.  The other
# binaries ride along as assets, so "make deb" builds the workspace
# first and then packages without rebuilding.
[package.metadata.deb]
name = "smartclockmon"
maintainer = "Christopher Hoover <ch@murgatroid.com>"
copyright = "2026, Christopher Hoover"
extended-description = """\
Library, logging daemon and terminal monitor for HP / Symmetricom \
SmartClock GPS time and frequency reference receivers, spoken to over \
RS-232.  The daemon holds the serial port open and records oscillator \
and holdover history so it accumulates whether or not anyone is \
watching."""
section = "utils"
priority = "optional"
depends = "$auto, adduser"
assets = [
    ["target/release/smartclockd", "usr/bin/", "755"],
    ["target/release/smartclock-cli", "usr/bin/", "755"],
    ["target/release/smartclockmon", "usr/bin/", "755"],
    ["target/release/smartclock-exporter", "usr/bin/", "755"],
    ["target/release/smartclock-web", "usr/bin/", "755"],
    ["target/release/smartclock-sensord", "usr/bin/", "755"],
    ["../../packaging/systemd/smartclockd@.service", "usr/lib/systemd/system/smartclockd@.service", "644"],
    ["../../packaging/systemd/smartclockd.default", "etc/default/smartclockd", "644"],
    ["../../packaging/systemd/smartclock-exporter.default", "etc/default/smartclock-exporter", "644"],
    ["../../packaging/systemd/smartclock-web.default", "etc/default/smartclock-web", "644"],
    ["../../packaging/systemd/smartclock-sensord.default", "etc/default/smartclock-sensord", "644"],
    ["../../README.md", "usr/share/doc/smartclockmon/README.md", "644"],
    ["../../docs/screen-format-strings.md", "usr/share/doc/smartclockmon/screen-format-strings.md", "644"],
    ["../../docs/z3801-keywords.md", "usr/share/doc/smartclockmon/z3801-keywords.md", "644"],
    ["../../docs/running.md", "usr/share/doc/smartclockmon/running.md", "644"],
    ["../../docs/commands.md", "usr/share/doc/smartclockmon/commands.md", "644"],
    ["../../docs/firmware/README.md", "usr/share/doc/smartclockmon/firmware/README.md", "644"],
    ["../../docs/firmware/gps.md", "usr/share/doc/smartclockmon/firmware/gps.md", "644"],
    ["../../docs/firmware/interval.md", "usr/share/doc/smartclockmon/firmware/interval.md", "644"],
    ["../../docs/firmware/loop.md", "usr/share/doc/smartclockmon/firmware/loop.md", "644"],
    ["../../docs/firmware/ovens.md", "usr/share/doc/smartclockmon/firmware/ovens.md", "644"],
    ["../../docs/firmware/console.md", "usr/share/doc/smartclockmon/firmware/console.md", "644"],
    ["../../docs/firmware/restart.md", "usr/share/doc/smartclockmon/firmware/restart.md", "644"],
    ["../../docs/efc.md", "usr/share/doc/smartclockmon/efc.md", "644"],
    ["../../docs/ocxo.md", "usr/share/doc/smartclockmon/ocxo.md", "644"],
    ["../../docs/sensors.md", "usr/share/doc/smartclockmon/sensors.md", "644"],
]
conf-files = [
    "/etc/default/smartclockd",
    "/etc/default/smartclock-exporter",
    "/etc/default/smartclock-web",
    "/etc/default/smartclock-sensord",
]
maintainer-scripts = "../../packaging/debian/"
changelog = "../../packaging/debian/changelog"
# All three ship disabled: the exporter and the web view each need a
# socket named first, the exporter is only wanted where something
# scrapes it, and the sensor service needs its sensors named.  The
# daemon is a template unit, smartclockd@.service, installed as a
# plain asset above, since cargo-deb's unit handling is for units
# enabled by name; an instance is enabled by hand once its environment
# file exists.
systemd-units = [
    { unit-name = "smartclock-exporter", unit-scripts = "../../packaging/systemd", enable = false, start = false },
    { unit-name = "smartclock-web", unit-scripts = "../../packaging/systemd", enable = false, start = false },
    { unit-name = "smartclock-sensord", unit-scripts = "../../packaging/systemd", enable = false, start = false },
]
