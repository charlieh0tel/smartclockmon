[package]
name = "smartclock-sensord"
description = "Reads the host's hwmon and IIO sensors into a log beside SmartClock receivers'"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
glob = "0.3.4"
jiff = "0.2.38"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
smartclock = { path = "../smartclock" }
smartclock-log = { path = "../smartclock-log" }
temper-hid = "1.2.0"
thiserror = "2.0.21"
