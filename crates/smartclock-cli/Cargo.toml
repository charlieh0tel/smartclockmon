[package]
name = "smartclock-cli"
description = "One-shot queries, diagnostics, and transcript capture for SmartClock receivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
interprocess = "2.4.4"
jiff = "0.2.37"
serde_json = "1.0.151"
sha2 = "0.11.0"
smartclock = { path = "../smartclock" }
thiserror = "2.0.21"

[dev-dependencies]
smartclock-sim = { path = "../smartclock-sim" }

[target."cfg(unix)".dependencies]
signal-hook = "0.4.5"
