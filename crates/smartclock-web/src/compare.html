<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartClock compare</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css"
      integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE"
      crossorigin="anonymous">

<link rel="stylesheet" href="/style.css">

<div class="panel" id="status"><span class="muted">connecting...</span></div>

<nav class="panel nav">
  <a href="/">Live</a>
  <a href="/status">Status</a>
  <a href="/adev">Stability</a>
  <a href="/compare" aria-current="page">Compare</a>
</nav>

<!-- The shared receiver picker, which the strip follows; this page
     shows every receiver, so the picker is kept but not shown. -->
<div class="panel" id="unit-bar" style="display: none">
  <div class="controls">
    <label for="unit">Receiver</label>
    <select id="unit"></select>
    <span class="grow"></span>
    <span id="unit-seen" class="muted"></span>
  </div>
</div>

<div class="panel">
  <div class="controls">
    <span id="compared"></span>
    <span class="grow"></span>
    <span id="ranges"></span>
  </div>
  <div id="charts"></div>
  <div id="note-tip"></div>
  <div id="note"></div>
</div>

<div class="panel">
  <div class="controls">
    <h2>Stability of the 1 PPS against GPS: MDEV solid, ADEV dashed</h2>
  </div>
  <div id="pane"><div id="chart-deviation"></div></div>
  <div id="deviation-note" class="muted"></div>
</div>

<footer id="colophon"></footer>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script src="/common.js"></script>
<script src="/charts.js"></script>
<script>
"use strict";

// Every receiver the logs hold, over one range: their history overlaid
// a chart per column, and their stability curves on one plot.  Each
// receiver's own 1 PPS interval is against its own GPS solution, so
// the lines show each unit's error, not one unit against another.

const haveUplot = typeof uPlot !== "undefined";
const view = new URLSearchParams(location.search);
readRange(86400);

// What is overlaid, in the order it is stacked.
const COMPARED = ["time_interval_s", "efc_percent", "temperature_c", "tfom", "ffom"];

// One color per receiver, by its serial's place among all the serials
// listed: not by the server's order, which follows when each was last
// seen and so changes under the reader.
const PALETTE = ["#38bdf8", "#fbbf24", "#f472b6", "#a78bfa", "#4ade80", "#f87171"];
const colorOf = (serial) => {
  const order = receivers.map((r) => r.serial).sort();
  return PALETTE[Math.max(0, order.indexOf(serial)) % PALETTE.length];
};

const SYNC = haveUplot ? uPlot.sync("compare") : null;
// How long one stability measurement may take, as on its own page.
const MEASURE_TIMEOUT = 60000;
// The shortest refresh the page offers, in seconds: each measures every
// receiver's stability again.
const COMPARE_FLOOR = 60;
// How long after the last resize or drag the page is read again, in
// milliseconds.
const COALESCE = 120;
// How often the picker looks for a receiver that has appeared, in
// milliseconds.
const PICKER_EVERY = 1000;

let charts = [];
let deviationChart = null;
// The receivers ticked, by serial.  Null until the first read decides:
// every receiver with readings in the range.
let ticked = view.has("receivers")
  ? new Set(view.get("receivers").split(",").filter(Boolean))
  : null;
// Every ticked receiver's notes, as `drawNoteLines` takes them.
let marks = [];

function rememberTicked() {
  remember({ receivers: [...ticked].join(",") });
}

// A checkbox per receiver, in its color.
function pickers() {
  offered = receivers.map((r) => r.serial).join(",");
  $("compared").innerHTML = receivers
    .map(
      (r) =>
        `<label><input type="checkbox" data-serial="${esc(r.serial)}"` +
        `${ticked?.has(r.serial) ? " checked" : ""}> ` +
        `<span style="color:${colorOf(r.serial)}">${esc(unitName(r.serial))}</span></label>`,
    )
    .join(" ");
  for (const box of $("compared").querySelectorAll("input")) {
    box.onchange = () => {
      if (box.checked) ticked.add(box.dataset.serial);
      else ticked.delete(box.dataset.serial);
      rememberTicked();
      renew();
    };
  }
}

function clearCharts(why) {
  for (const c of charts) c.destroy();
  charts = [];
  deviationChart?.destroy();
  deviationChart = null;
  $("charts").innerHTML = "";
  $("chart-deviation").innerHTML = "";
  $("deviation-note").textContent = "";
  noteTip(null, null);
  $("note").textContent = why;
}

// The window every receiver is asked for, in whole unix seconds.  One
// window, asked of all, puts their buckets on one grid (the server
// buckets on `from`, `to` and the point count), so a cursor finds a
// value from every receiver rather than from one.  "all" is only
// knowable once asked: each receiver's extent, then their union.
async function sharedWindow(serials, signal) {
  if (range.last !== "all") {
    const { from, to } = rangeBounds();
    return { from: Math.round(from), to: Math.round(to) };
  }
  const extents = await Promise.all(
    serials.map((s) => quietly(ask(historyQuery(s, null), signal), null)),
  );
  const found = extents.filter((e) => e?.first && e.last > e.first);
  if (!found.length) return null;
  return {
    from: Math.round(Math.min(...found.map((e) => e.first))),
    to: Math.round(Math.max(...found.map((e) => e.last))),
  };
}

// A history request for one receiver over `win`, or the server's
// default when there is none.
function historyQuery(serial, win) {
  const q = new URLSearchParams({ receiver: serial, columns: COMPARED.join(",") });
  if (win) {
    q.set("from", win.from);
    q.set("to", win.to);
    q.set("points", pointsFor(win.to - win.from));
  }
  return "/api/history?" + q;
}

async function historyOf(serial, win, signal) {
  const got = await ask(historyQuery(serial, win), signal);
  return { ...got, at: onGrid(got.at, win) };
}

async function deviationOf(serial, win, signal) {
  const q = new URLSearchParams({
    receiver: serial,
    from: String(win.from),
    to: String(win.to),
  });
  return ask("/api/adev?" + q, signal, MEASURE_TIMEOUT);
}

async function notesOf(serial, win, signal) {
  const q = new URLSearchParams({ receiver: serial, from: win.from, to: win.to });
  const ranged = await ask("/api/notes?" + q, signal);
  return ranged.map((n) => ({
    at: Date.parse(n.at) / 1000,
    text: `${unitName(serial)}: ${n.text}`,
    color: colorOf(serial),
  }));
}

function drawHistory(shown, got, groups) {
  // One table per receiver, and one per sensor, joined on time.
  const tables = [
    ...shown.map((serial) => [
      got[serial].at,
      ...COMPARED.map((col) => {
        const plot = got[serial].plots.find((p) => p.column === col);
        return plot ? scaled(plot.mean, col) : got[serial].at.map(() => null);
      }),
    ]),
    ...groups.flatMap((g) => g.lines.map((l) => [l.at, l.values])),
  ];
  const joined = joinTables(tables);
  const columnsOf = (n) => shown.map((_, i) => joined[1 + i * COMPARED.length + n]);
  // A chart per compared column, a line per receiver; then a chart per
  // sensor quantity, a line per sensor, below them.
  let next = 1 + shown.length * COMPARED.length;
  const charted = [
    ...COMPARED.map((col, n) => ({
      col,
      lines: shown.map((serial, i) => ({
        label: unitName(serial),
        color: colorOf(serial),
        values: columnsOf(n)[i],
      })),
    })),
    ...groups.map((g) => ({
      col: `sensor:${g.quantity}`,
      hint: sensorHint(g.lines),
      lines: g.lines.map((l, i) => ({
        label: l.name,
        color: l.color,
        values: joined[next++],
      })),
    })),
  ];
  const finite = (c) => c.lines.flatMap((l) => l.values).filter((v) => v != null && isFinite(v));
  // Only what some ticked receiver or sensor measured: a chart with no
  // data has no y axis, which would shift its plot out of line with the
  // rest.
  const drawn = charted.filter((c) => finite(c).length);
  const height = plotHeight(drawn.length);
  const fits = drawn.map((c) => yAxis(c.col, finite(c), height));
  const ySize = stackWidth(fits);
  drawn.forEach((drawing, place) => {
    const col = drawing.col;
    const fitted = fits[place];
    const host = document.createElement("div");
    $("charts").appendChild(host);
    const chart = ranged(new uPlot(
      {
        width: $("charts").clientWidth || 800,
        height,
        padding: [null, STACK_RIGHT, null, null],
        title: label(col),
        series: [
          {},
          ...drawing.lines.map((l) => ({
            label: l.label,
            stroke: l.color,
            width: 1.5,
            points: { show: false },
          })),
        ],
        axes: [
          {
            stroke: "#8b929c",
            grid: { stroke: "#2b3038" },
            ticks: { stroke: "#2b3038" },
            show: place === drawn.length - 1,
          },
          {
            stroke: "#8b929c",
            grid: { stroke: "#2b3038" },
            ticks: { stroke: "#2b3038" },
            ...fitted.axis,
            size: ySize,
          },
        ],
        scales: {
          x: { time: true },
          ...(fitted.range ? { y: { range: fitted.range } } : {}),
        },
        legend: { show: true, live: true },
        cursor: { drag: { x: true, y: false }, sync: { key: SYNC.key, setSeries: false } },
        hooks: {
          draw: [(u) => drawNoteLines(u, marks)],
          setCursor: [
            () => {
              const under = charts.find((c) => c.over.matches(":hover"));
              noteTip(under, under ? noteAt(under, marks) : null);
            },
          ],
          ...TIME_HOOKS,
        },
      },
      [joined[0], ...drawing.lines.map((l) => l.values)],
      host,
    ));
    if (drawing.hint) hintAs(chart, drawing.hint);
    else hint(chart, col);
    charts.push(chart);
  });
  settleWidths(charts, $("charts"));
}

function drawDeviation(shown, curves) {
  const drawn = shown.filter((serial) => curves[serial]?.points?.length);
  if (!drawn.length) {
    $("chart-deviation").innerHTML = `<p class="muted pad">nothing to plot in this range</p>`;
    return;
  }
  const joined = uPlot.join(
    drawn.map((serial) => {
      const points = curves[serial].points;
      return [
        points.map((p) => p.tau),
        points.map((p) => (p.modified ? p.modified.deviation : null)),
        points.map((p) => p.deviation),
      ];
    }),
  );
  const wide = Math.max(DEVIATION_PLOT.min, $("pane").clientWidth || 800);
  deviationChart = new uPlot(
    {
      width: wide,
      height: Math.round(
        Math.max(DEVIATION_PLOT.shortest, Math.min(DEVIATION_PLOT.tallest, wide / DEVIATION_PLOT.ratio)),
      ),
      scales: { x: TAU_SCALE, y: sigmaScale({}) },
      axes: [tauAxis(), sigmaAxis("deviation σy")],
      series: [
        { label: "τ", value: (_, v) => seconds(v) },
        ...drawn.flatMap((serial) => [
          {
            label: `${unitName(serial)} MDEV`,
            stroke: colorOf(serial),
            width: 1.5,
            points: { show: true, size: 5 },
            value: (_, v) => decade(v),
          },
          {
            label: `${unitName(serial)} ADEV`,
            stroke: colorOf(serial),
            width: 1,
            dash: [6, 4],
            points: { show: false },
            value: (_, v) => decade(v),
          },
        ]),
      ],
      legend: { show: true, live: true },
    },
    joined,
    $("chart-deviation"),
  );
  deviationChart.over.addEventListener("dblclick", () => {
    deviationChart.setScale("x", { min: null, max: null });
    deviationChart.setScale("y", { min: null, max: null });
  });
}

// One receiver's answer, or `instead` if it has none to give: one
// unit's log failing to read leaves the others on the page.
async function quietly(answer, instead) {
  try {
    return await answer;
  } catch (e) {
    if (e instanceof Superseded) throw e;
    return instead;
  }
}

async function load(signal) {
  if (!haveUplot) {
    clearCharts(
      "The chart library did not load. It comes from a CDN, so this page needs internet access.",
    );
    return;
  }
  // Every receiver until the first read has decided what is ticked;
  // after that only the ticked ones.
  const serials = receivers
    .map((r) => r.serial)
    .filter((s) => ticked === null || ticked.has(s));
  const win = await sharedWindow(serials, signal);
  if (!win) {
    if (ticked === null) ticked = new Set();
    pickers();
    clearCharts("no receiver has readings");
    return;
  }
  const got = Object.fromEntries(
    await Promise.all(
      serials.map(async (s) => [s, await quietly(historyOf(s, win, signal), { failed: true, at: [] })]),
    ),
  );
  if (ticked === null) {
    // A receiver that could not be read is ticked: it is not known to
    // have nothing.
    ticked = new Set(serials.filter((s) => got[s].failed || got[s].at.length));
    rememberTicked();
  }
  pickers();
  const shown = serials.filter((s) => ticked.has(s) && got[s].at.length);
  const failed = serials.filter((s) => ticked.has(s) && got[s].failed);
  const quiet = serials.filter((s) => ticked.has(s) && !got[s].failed && !got[s].at.length);
  clearCharts(
    [
      !shown.length && !failed.length ? "no ticked receiver has readings in this range" : "",
      failed.length ? `could not read ${failed.map(unitName).join(", ")}` : "",
      quiet.length ? `no readings in this range from ${quiet.map(unitName).join(", ")}` : "",
    ]
      .filter(Boolean)
      .join("; "),
  );
  if (!shown.length) return;
  marks = (await Promise.all(shown.map((s) => quietly(notesOf(s, win, signal), [])))).flat();
  const groups = await sensorGroups(await sensorsListed(signal), win, signal);
  drawHistory(shown, got, groups);
  const curves = Object.fromEntries(
    await Promise.all(shown.map(async (s) => [s, await quietly(deviationOf(s, win, signal), null)])),
  );
  drawDeviation(shown, curves);
  // A curve from a range longer than one measurement reads covers only
  // its newest part; said, since the plot cannot show it.
  const unread = shown.filter((s) => curves[s] === null);
  const partial = shown.filter((s) => curves[s]?.truncated);
  $("deviation-note").textContent = [
    unread.length ? `could not measure ${unread.map(unitName).join(", ")}` : "",
    partial.length
      ? `the range is longer than one measurement reads; these curves are its newest part: ` +
        partial.map(unitName).join(", ")
      : "",
  ]
    .filter(Boolean)
    .join("; ");
}

// Drawn again a moment after the last resize or drag rather than on
// every event: a resize fires dozens a second, a drag fires on every
// synced chart, and each read measures every receiver's stability.
let settling = null;
function soon() {
  clearTimeout(settling);
  settling = setTimeout(() => renew(), COALESCE);
}

rangeControl($("ranges"), soon);
addEventListener("resize", soon);
// A receiver that appears is offered, unticked, as soon as the list
// that common.js keeps has it, not at the next read.  Rebuilt only on a
// change, so a box is not replaced under a click.
let offered = "";
setInterval(() => {
  const listed = receivers.map((r) => r.serial).join(",");
  if (ticked !== null && listed !== offered) pickers();
}, PICKER_EVERY);
content({
  daemon: false,
  floor: COMPARE_FLOOR,
  clear: clearCharts,
  load,
});
</script>
