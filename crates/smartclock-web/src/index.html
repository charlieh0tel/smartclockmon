<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script src="/common.js"></script>
<script src="/charts.js"></script>
<script>
"use strict";

// The chart library is fetched from a CDN, so say so plainly rather
// than leaving an empty rectangle if it did not arrive.
const haveUplot = typeof uPlot !== "undefined";

// The view is taken from the URL so a particular one can be kept: a
// link to "EFC against temperature over the last day" is worth more
// than a description of how to click to it.
const view = new URLSearchParams(location.search);

let charts = [];
readRange(3600);
// Several series, stacked, sharing one time axis.  `column` singular is
// still read so an older bookmark still opens on what it named.
// What is shown unless the URL says otherwise, in the order it is
// stacked.  The menu is built in this order too, and the picker
// rebuilds the selection in menu order on every change: a default in
// any other order made the very first tick reshuffle the stack.
const DEFAULT_COLUMNS = [
  "time_interval_s", "efc_percent", "tracking", "not_tracking",
  "temperature_c", "tfom", "ffom",
];

let columns = (view.get("columns") ?? view.get("column") ?? DEFAULT_COLUMNS.join(","))
  .split(",")
  .filter(Boolean);

// Whether the host's sensors are drawn: unless the address says
// `sensors=off`.  Kept apart from `columns=`, so an address from before
// there were sensors shows them too.
let withSensors = view.get("sensors") !== "off";
// Whether the sensor log holds any, which decides whether the menu
// offers them, and the columns the menu was last built from.
let haveSensors = false;
let offeredColumns = [];

// uPlot ties charts together by a shared key: hovering one moves the
// cursor on all of them, which is most of what makes a stack readable.
const SYNC = haveUplot ? uPlot.sync("smartclock") : null;

// The two trace colors, named once.  Both the plot and the things
// that say which line is which read them from here, because a key that
// disagrees with the lines is worse than no key.
const TRACE = "#38bdf8";
const MATE = "#fbbf24";
// A person's note, drawn as a dashed line across every chart.
const NOTE = "#4ade80";
// How far either side of a note the charts show when it is clicked in
// the journal, in seconds.
const NOTE_SPAN = 3600;
// The notes for the receiver shown, from the journal, as
// `drawNotes` takes them.
let notes = [];

// Center the charts on a note's time, and bring them into view.
function showNote(at) {
  fixRange(at - NOTE_SPAN, at + NOTE_SPAN);
  $("charts").scrollIntoView({ behavior: "smooth", block: "start" });
}

const drawNotes = (u) => drawNoteLines(u, notes);
const noteNear = (u) => noteAt(u, notes);

// ---------------------------------------------------------------- charts

function seriesQuery(cols, from, to, seconds) {
  const q = new URLSearchParams({ columns: cols.join(","), points: pointsFor(seconds) });
  if (from) q.set("from", Math.round(from));
  if (to) q.set("to", Math.round(to));
  return "/api/history?" + withUnit(q);
}

const fetchSeries = (signal, ...args) => ask(seriesQuery(...args), signal);

// Tracked and not tracked are one measurement split two ways: their
// sum is the satellites the receiver knows about, so a chart apiece
// hides the relationship that matters.  Drawn together, the only
// columns that are.
const PAIRED = ["tracking", "not_tracking"];

// Split two labels into what they have in common and what each adds,
// on a word boundary.  "# sats tracked" and "# sats not tracked"
// become "# sats " with "tracked" and "not tracked", so the title
// says the subject once and colors only the part that tells the two
// lines apart.
function shareName(a, b) {
  const x = a.split(" ");
  const y = b.split(" ");
  let n = 0;
  while (n < x.length && n < y.length && x[n] === y[n]) n++;
  if (n === 0) return ["", a, b];
  return [x.slice(0, n).join(" ") + " ", x.slice(n).join(" "), y.slice(n).join(" ")];
}

// The colors of a chart's lines, in order.  A chart of one line draws
// it in the first.
const LINE_COLORS = [TRACE, MATE];

// The charts of the stack, from the server's plots: a chart per
// column, with the paired columns sharing one.  Each chart is
//   column    what its y axis is fitted to and its hover text is for
//   envelope  { min, max }, drawn behind the first line, or null
//   lines     [{ column, values, color }] on one y axis, in order
function chartsOf(plots) {
  const line = (plot, n) => ({
    column: plot.column,
    values: scaled(plot.mean, plot.column),
    color: LINE_COLORS[n],
  });
  const partner = plots.find((p) => p.column === PAIRED[1]);
  const paired = plots.some((p) => p.column === PAIRED[0]) && partner;
  return plots
    .filter((p) => !(paired && p.column === PAIRED[1]))
    .map((plot) => ({
      column: plot.column,
      envelope: { min: scaled(plot.min, plot.column), max: scaled(plot.max, plot.column) },
      lines: [line(plot, 0), ...(paired && plot.column === PAIRED[0] ? [line(partner, 1)] : [])],
    }));
}

// A multi-line chart's title, each line's own words in its color, so
// the title says which line is which with the legend off.
function groupTitle(lines) {
  if (lines.some((l) => l.name)) {
    return (
      esc(label(lines[0].column)) +
      '<span class="muted">: </span>' +
      lines
        .map((l) => `<span style="color:${l.color}">${esc(l.name)}</span>`)
        .join('<span class="muted">, </span>')
    );
  }
  if (lines.length === 2) {
    const [shared, mine, theirs] = shareName(label(lines[0].column), label(lines[1].column));
    return (
      esc(shared) +
      `<span style="color:${lines[0].color}">${esc(mine)}</span>` +
      `<span class="muted"> and </span>` +
      `<span style="color:${lines[1].color}">${esc(theirs)}</span>`
    );
  }
  return lines
    .map((l) => `<span style="color:${l.color}">${esc(label(l.column))}</span>`)
    .join('<span class="muted">, </span>');
}

// Take the charts down, saying why in their place.
function clearCharts(why) {
  hold($("charts"), why === "");
  for (const c of charts) c.destroy();
  charts = [];
  $("charts").innerHTML = "";
  $("readout").innerHTML = "";
  noteTip(null, null);
  $("note").textContent = why;
}

async function draw(signal) {
  if (!haveUplot) {
    $("note").textContent =
      "The chart library did not load. It comes from a CDN, so this page needs internet access; the readings above do not.";
    return;
  }
  // What was asked for, less what this unit does not measure: the
  // choice is kept in the address, and comes back for a unit that does.
  // With no receiver logged at all there is nothing of the receiver's
  // to ask for, and the sensors are drawn alone.
  const wanted = receivers.length ? columns.filter(measures) : [];
  const listing = await sensorsListed(signal);
  if (Boolean(listing.sensors.length) !== haveSensors) {
    haveSensors = Boolean(listing.sensors.length);
    pickers(offeredColumns);
  }
  const listed = withSensors ? listing : { sensors: [] };
  if (!wanted.length && !listed.sensors.length) {
    clearCharts(receivers.length ? "nothing selected" : "no receiver is logged");
    return;
  }
  const bounds = rangeBounds();
  let { from, to } = bounds;
  if (from === 0) from = null;
  let seconds = bounds.seconds;

  let got;
  if (wanted.length) {
    got = await fetchSeries(signal, wanted, from, to, seconds);
    // How far back the log goes is only knowable once it has been
    // asked, so "all" costs a second request: the first answers with
    // the server's default hour and the extent, the second asks for
    // the extent.  Without this the button quietly showed the last
    // hour -- the range it names is the one range it did not fetch.
    if (range.last === "all" && got.first && got.last > got.first) {
      seconds = got.last - got.first;
      got = await fetchSeries(signal, wanted, got.first, got.last, seconds);
    }
  } else {
    // The sensors alone: their own extent stands in for the receiver's.
    if (range.last === "all" && listed.first != null) {
      from = listed.first;
      to = listed.last;
      seconds = to - from;
    }
    got = { at: [], plots: [], from: Math.round(from ?? 0), to: Math.round(to ?? Date.now() / 1000) };
  }
  // The grid the server bucketed on, which the sensors are asked for
  // and snapped to as well.
  const win = { from: got.from, to: got.to, points: pointsFor(seconds) };
  const groups = await sensorGroups(listed, win, signal);
  const anything = got.at.length || groups.length;
  clearCharts(
    !anything ? "no readings in this range"
      : wanted.length && !got.at.length ? "no readings from the receiver in this range"
      : "",
  );
  if (!anything) return;

  const drawn = chartsOf(got.plots);
  // One time axis for the receiver's charts and the sensors', joined
  // on the grid; without sensors the receiver's own times are kept.
  let x = got.at;
  const sensorDrawings = groups.map((group) => ({
    column: `sensor:${group.quantity}`,
    envelope: null,
    named: true,
    hint: sensorHint(group.lines),
    lines: group.lines.map((line, i) => ({
      column: `sensor:${group.quantity}`,
      name: line.name,
      values: line.values,
      color: line.color,
      at: line.at,
    })),
  }));
  if (sensorDrawings.length) {
    const arrays = (d) => [
      ...(d.envelope ? [d.envelope.min, d.envelope.max] : []),
      ...d.lines.map((l) => l.values),
    ];
    const joined = joinTables([
      [onGrid(got.at, win), ...drawn.flatMap(arrays)],
      ...sensorDrawings.flatMap((d) => d.lines.map((l) => [l.at, l.values])),
    ]);
    x = joined[0];
    let k = 1;
    for (const d of [...drawn, ...sensorDrawings]) {
      if (d.envelope) {
        d.envelope.min = joined[k++];
        d.envelope.max = joined[k++];
      }
      for (const l of d.lines) l.values = joined[k++];
    }
    // Right below the receiver's own temperature, which is what a room
    // temperature is read against; at the end without it.
    const after = drawn.findIndex((d) => d.column === "temperature_c");
    drawn.splice(after < 0 ? drawn.length : after + 1, 0, ...sensorDrawings);
  }
  // Only charts with something to draw: one with no data has no y axis,
  // which would shift its plot out of line with the rest, as the
  // receiver's charts are beside sensors in a range it has no readings
  // in.
  const filled = (d) =>
    [...(d.envelope ? [d.envelope.min, d.envelope.max] : []), ...d.lines.map((l) => l.values)]
      .flat()
      .some((v) => v != null && isFinite(v));
  drawn.splice(0, drawn.length, ...drawn.filter(filled));
  const height = plotHeight(drawn.length);
  // The scale has to cover the envelope, not just the lines: the min
  // and max are drawn, and an axis that ends below them would clip the
  // very excursions they exist to show.
  const fits = drawn.map((chart) => {
    const values = [
      ...(chart.envelope ? [chart.envelope.min, chart.envelope.max] : []),
      ...chart.lines.map((l) => l.values),
    ]
      .flat()
      .filter((v) => v != null && isFinite(v));
    return yAxis(chart.column, values, height);
  });
  const ySize = stackWidth(fits);
  drawn.forEach((drawing, n) => {
    const fitted = fits[n];
    // A chart of named lines, a sensor's, says the names whatever their
    // number; a receiver's chart colors its lines only to tell several
    // apart.
    const several = drawing.lines.length > 1 || Boolean(drawing.named);
    // Only the bottom chart carries the time labels.  Repeating them
    // under every plot costs the height that makes the stack worth
    // having, and says the axes might differ when the whole point is
    // that they cannot.
    const last = n === drawn.length - 1;
    const host = document.createElement("div");
    $("charts").appendChild(host);

    const opts = {
      width: $("charts").clientWidth || 800,
      height,
      padding: [null, STACK_RIGHT, null, null],
      title: drawing.lines.map((l) => label(l.column)).join(" and "),
      series: [
        {},
        ...(drawing.envelope
          ? [
              { label: "min", stroke: "#0e7490", width: 1, points: { show: false } },
              { label: "max", stroke: "#0e7490", width: 1, points: { show: false } },
            ]
          : []),
        ...drawing.lines.map((l) => ({
          label: l.name ?? label(l.column),
          stroke: l.color,
          width: 1.5,
          points: { show: false },
        })),
      ],
      axes: [
        {
          stroke: "#8b929c",
          grid: { stroke: "#2b3038" },
          ticks: { stroke: "#2b3038" },
          show: last,
        },
        {
          stroke: "#38bdf8",
          grid: { stroke: "#2b3038" },
          ticks: { stroke: "#2b3038" },
          ...fitted.axis,
          size: ySize,
        },
      ],
      scales: {
        x: { time: true },
        ...(fitted.range ? { y: { range: fitted.range } } : {}),
      },
      // No per-chart legend.  With the cursor synced there is one
      // instant being pointed at, not one per plot, so the values
      // belong in one row -- and `show: last` meant only the bottom
      // plot had any readout at all, which is the opposite of what
      // aligning them is for.
      legend: { show: false },
      cursor: {
        drag: { x: true, y: false },
        // Every chart moves together, which is what makes reading one
        // value across the stack possible at all.
        sync: { key: SYNC.key, setSeries: false },
      },
      hooks: {
        setCursor: [() => readout()],
        draw: [drawNotes],
        ...TIME_HOOKS,
      },
    };
    const chart = ranged(new uPlot(
      opts,
      [
        x,
        ...(drawing.envelope ? [drawing.envelope.min, drawing.envelope.max] : []),
        ...drawing.lines.map((l) => l.values),
      ],
      host,
    ));
    // Which lines this chart draws, and from which series, so the
    // shared readout can label them without reaching back into the
    // request that built it.  A line's color is said only where there
    // are several to tell apart.
    chart.smartclockLines = drawing.lines.map((l, i) => ({
      column: l.column,
      name: l.name,
      series: 1 + (drawing.envelope ? 2 : 0) + i,
      color: several ? l.color : null,
    }));
    if (drawing.hint) hintAs(chart, drawing.hint);
    else hint(chart, ...drawing.lines.map((l) => l.column));
    // uPlot's title is plain text, and with the legend off a chart of
    // several lines otherwise names them without saying which is which.
    if (several) {
      const heading = chart.root.querySelector(".u-title");
      if (heading) heading.innerHTML = groupTitle(drawing.lines);
    }
    charts.push(chart);
  });
  settleWidths(charts, $("charts"));
  release($("charts"));
  // Say what the row is for before anything has been hovered, rather
  // than leaving an empty strip that looks like a rendering fault.
  readout();
}

// One value per series at the instant the cursor is on, plus the time
// once.  Built here rather than left to uPlot because its legend is per
// chart, and a stack sharing a cursor wants a readout that shares it
// too.
function readout() {
  const el = $("readout");
  if (!charts.length) { el.innerHTML = ""; return; }
  // Synced, so whichever chart is under the pointer has the index and
  // the rest agree; when the pointer leaves, none of them do.
  const idx = charts.map((c) => c.cursor.idx).find((i) => i != null);
  // The same cells are drawn whether or not anything is under the
  // pointer, with dashes for the values when nothing is.  Swapping the
  // row for a one-line "hover a plot" message moved everything below
  // it up and down as the pointer crossed the stack.
  const show = (v) =>
    v == null ? "--" : v.toLocaleString(undefined, { maximumFractionDigits: 3 });
  const at = idx == null ? null : new Date(charts[0].data[0][idx] * 1000);
  const cells = charts.flatMap((c) => {
    const one = (col, v, color, name) =>
      `<span><span class="k"${color ? ` style="color:${color}"` : ""}>` +
      `${esc(name ?? columnName(col))}</span> ` +
      `<span class="v">${esc(show(v))}</span></span>`;
    // A series joined with another log's has no point at the other's
    // times, `undefined` there, so the nearest point either side is
    // taken; a gap, `null`, is not looked across.
    const value = (series) => {
      if (idx == null) return null;
      const data = c.data[series];
      for (let d = 0; d < data.length; d++) {
        for (const i of [idx - d, idx + d]) {
          if (i >= 0 && i < data.length && data[i] !== undefined) return data[i];
        }
      }
      return null;
    };
    // A cell per line: one number under a chart of several lines would
    // leave the reader guessing which line it belonged to.
    return c.smartclockLines.map((l) => one(l.column, value(l.series), l.color, l.name));
  });
  const note = charts.map(noteNear).find((n) => n != null);
  // Beside the pointer on the chart it is over; the others follow
  // the cursor's time only.
  const under = charts.find((c) => c.over.matches(":hover"));
  noteTip(under, under ? noteNear(under) : null);
  el.innerHTML =
    `<span class="v">${at ? esc(at.toLocaleTimeString()) : "--:--:--"}</span>` +
    cells.join("") +
    (note ? `<span><span class="k" style="color:${NOTE}">note</span> ${esc(note)}</span>` : "");
}

function pickers(plottable) {
  offeredColumns = plottable;
  // The pair is one choice.  Tracked and not tracked are one
  // measurement split two ways and share a chart, so offering them as
  // two ticks invited half of it.
  // The ones shown by default come first, so the row reads as the
  // stack does and the rest are extras after them.
  const order = [
    ...DEFAULT_COLUMNS.filter((c) => plottable.includes(c)),
    ...plottable.filter((c) => !DEFAULT_COLUMNS.includes(c)),
  ];
  // Only what this unit measures is offered.  `order` keeps the rest, so
  // a column ticked for another unit stays chosen for when it is back.
  const menu = order.filter((c) => c !== PAIRED[1] && measures(c));
  const shown = (c) => (c === PAIRED[0] ? "# sats" : columnName(c));
  const hover = (c) => hintText(...(c === PAIRED[0] ? PAIRED : [c]));
  $("columns").innerHTML = menu
    .map(
      (c) =>
        `<label${hover(c) ? ` title="${esc(hover(c))}"` : ""}>` +
        `<input type="checkbox" data-col="${c}"` +
        `${columns.includes(c) ? " checked" : ""}> ` +
        // Underlined where there is hover text, because a bare title
        // attribute is only found by someone who already suspects it.
        `<span${hover(c) ? ' class="hinted"' : ""}>${esc(shown(c))}</span></label>`,
    )
    .join(" ") +
    (haveSensors
      ? ` <label title="The host's sensors, from smartclock-sensord">` +
        `<input type="checkbox" data-sensors${withSensors ? " checked" : ""}> ` +
        `<span class="hinted">Sensors</span></label>`
      : "");
  const sensorBox = $("columns").querySelector("input[data-sensors]");
  if (sensorBox) {
    sensorBox.onchange = () => {
      withSensors = sensorBox.checked;
      remember({ sensors: withSensors ? null : "off" });
      load();
    };
  }
  for (const box of $("columns").querySelectorAll("input[data-col]")) {
    box.onchange = () => {
      const col = box.dataset.col;
      const wanted = new Set(columns);
      for (const c of col === PAIRED[0] ? PAIRED : [col]) {
        if (box.checked) {
          wanted.add(c);
        } else {
          wanted.delete(c);
        }
      }
      // Kept in the menu's order rather than the order they were
      // ticked, so the stack does not reshuffle as it is built.
      columns = order.filter((c) => wanted.has(c));
      remember({ columns: columns.join(","), column: null });
      load();
    };
  }
}

// A change the reader made -- the columns, the range, a drag -- reads
// again, abandoning any read in flight.  Coalesced, because dragging
// fires setScale repeatedly.
const COALESCE = 120;
let pending = null;
function load() {
  clearTimeout(pending);
  pending = setTimeout(renew, COALESCE);
}

// ------------------------------------------------- the receiver's journal

// Streams the snapshot table does not carry and no chart can show:
// what the receiver wrote in its own diagnostic log, the changes in
// its alarm condition register, what its error queue held, and the
// notes a person wrote about it.  Tabbed rather than stacked because they are read one at a
// time and the panel would otherwise own the page.
const JOURNAL = [
  ["events", "transitions"],
  ["entries", "receiver log"],
  ["errors", "error queue"],
  ["notes", "notes"],
];
// Chosen on first draw as the first stream that has anything, unless
// the URL names one.  Defaulting to a fixed tab meant landing on an
// empty "transitions" and reading "nothing recorded" with a hundred
// log entries one tab away.
let stream = view.get("journal");

// The receiver's calendar can be behind by whole GPS epochs, so its own
// stamps are shown as written and never silently corrected -- the
// correction belongs where the rollover is known, not here.
const rows = {
  events: (r) => [local(r.at), `${esc(r.decoded)} <span class="muted">(${esc(r.register)} ${r.bits})</span>`],
  entries: (r) => [stamped(r), `<span class="muted">#${r.entry}</span> ${esc(r.message)}`],
  errors: (r) => [local(r.at), `<span class="muted">${r.code}</span> ${esc(r.message)}`],
  notes: (r) => [
    local(r.at),
    `<span class="note-link" data-at="${Date.parse(r.at) / 1000}" ` +
      `title="Show an hour either side on the charts">${esc(r.text)}</span>`,
  ],
};

// The receiver's own stamp as it wrote it, or when the daemon read the
// entry if it wrote none.  The Z3801A's hex stamp is seconds of GPS
// time since 1980-01-06 (097-z3801-01 4-13), shown as a date with the
// hex in the tooltip; like the calendar stamps, it is on the receiver's
// clock and carries whatever week rollover that clock has.
const GPS_EPOCH_MS = Date.UTC(1980, 0, 6);
function stamped(r) {
  if (!r.stamp) return local(r.at);
  const hex = /^H([0-9A-F]{8})$/i.exec(r.stamp);
  if (!hex) return esc(r.stamp);
  const at = new Date(GPS_EPOCH_MS + parseInt(hex[1], 16) * 1000);
  return `<span title="${esc(r.stamp)}">${esc(at.toISOString().slice(0, 19).replace("T", " "))} GPS</span>`;
}

const local = (iso) => {
  const at = new Date(iso);
  return isNaN(at) ? esc(iso) : esc(at.toLocaleString());
};

function drawJournal(journal) {
  if (stream === null || !(journal[stream] ?? []).length) {
    stream = JOURNAL.map(([key]) => key).find((key) => journal[key]?.length) ?? "events";
  }
  $("journal-tabs").innerHTML = JOURNAL.map(
    ([key, name]) =>
      `<button data-stream="${key}" class="${key === stream ? "on" : ""}">${name}` +
      ` (${journal[key]?.length ?? 0})</button>`,
  ).join(" ");
  for (const button of $("journal-tabs").querySelectorAll("button")) {
    button.onclick = () => {
      // Deliberate, so an empty tab the operator chose stays chosen
      // rather than being redirected by the rule above.
      stream = button.dataset.stream;
      $("journal-tabs")
        .querySelectorAll("button")
        .forEach((b) => b.classList.toggle("on", b.dataset.stream === stream));
      showStream(journal);
    };
  }
  showStream(journal);
}

function showStream(journal) {
  const list = journal[stream] ?? [];
  $("journal").innerHTML = list.length
    ? `<table><tbody>${list
        .map((r) => `<tr><td>${rows[stream](r)[0]}</td><td>${rows[stream](r)[1]}</td></tr>`)
        .join("")}</tbody></table>`
    : `<span class="muted">nothing recorded</span>`;
  for (const link of $("journal").querySelectorAll(".note-link")) {
    link.onclick = () => showNote(Number(link.dataset.at));
  }
}

async function loadJournal(signal) {
  const journal = await ask("/api/journal?" + withUnit(new URLSearchParams()), signal);
  drawJournal(journal);
  // The charts' range, not the journal's newest few: a note older
  // than those still belongs on a chart that reaches back to it.
  const q = withUnit(new URLSearchParams());
  const { from, to } = rangeBounds();
  if (from) q.set("from", Math.floor(from));
  if (to) q.set("to", Math.ceil(to));
  const ranged = await ask("/api/notes?" + q, signal);
  notes = ranged.map((n) => ({ at: Date.parse(n.at) / 1000, text: n.text, color: NOTE }));
  for (const c of charts) c.redraw(false);
}

// What the daemon says it is attached to, in the footer.
async function loadAbout(signal) {
  const info = await ask("/api/info" + liveQuery(), signal);
  $("about").textContent =
    [info.identity, info.dialect, `smartclockd ${info.version ?? "?"}`, "read only"]
      .filter(Boolean)
      .join("  --  ");
}

// What a person recorded the unit is made of, in the footer: each
// fact at its current value, since when.
async function loadFacts(signal) {
  const facts = await ask("/api/facts?" + withUnit(new URLSearchParams()), signal);
  $("facts").textContent = facts
    .map((f) => `${f.key} ${f.value} (since ${new Date(f.since).toLocaleDateString()})`)
    .join("  --  ");
}

// Each part reports its own failure in its own place, so a daemon that
// has gone takes the footer with it and leaves the history, which the
// logs still hold, where it is.
async function part(read, signal, failed) {
  try {
    await read(signal);
  } catch (e) {
    if (e instanceof Superseded) throw e;
    failed(e.message);
  }
}

const muted = (text) => `<span class="muted">${esc(text)}</span>`;

// ------------------------------------------------------------------ boot

// The shortest refresh the history offers, in seconds, as Grafana's
// minimum: a read is one bucketed query and the journal.
const HISTORY_FLOOR = 5;

(async function () {
  // One request before the first draw, to learn what may be plotted.
  // Asked of the server rather than listed here, so the menu cannot
  // drift from the columns the query will actually accept.
  const first = await getJson(seriesQuery(columns, null, null));
  const plottable = first.plottable ?? columns;
  rangeControl($("ranges"), load);
  addEventListener("resize", load);
  content({
    daemon: false,
    floor: HISTORY_FLOOR,
    chosen: () => pickers(plottable),
    clear(why) {
      clearCharts(why);
      notes = [];
      $("journal").innerHTML = muted(why);
      $("about").textContent = "";
      $("facts").textContent = "";
    },
    load: (signal) =>
      Promise.all([
        part(draw, signal, clearCharts),
        part(loadJournal, signal, (why) => ($("journal").innerHTML = muted(why))),
        part(loadAbout, signal, (why) => ($("about").textContent = why)),
        part(loadFacts, signal, (why) => ($("facts").textContent = why)),
      ]),
  });
})();
</script>
