<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartClock</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css"
      integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE"
      crossorigin="anonymous">

<style>
  :root {
    color-scheme: dark;
    --bg: #14161a; --panel: #1d2026; --line: #2b3038;
    --text: #e6e8eb; --dim: #8b929c;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --accent: #38bdf8;
    --font: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px; gap: 12px;
    display: grid; grid-template-columns: 1fr 340px;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 var(--font);
  }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .full { grid-column: 1 / -1; }
  h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--dim);
       text-transform: uppercase; letter-spacing: .08em; }

  /* Status strip: the few things worth seeing before anything else. */
  #status { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: baseline; }
  /* A fixed column, so a reading that gets wider -- "-5.8 ns" to
     "+122.6 ns" -- does not shove every tile after it sideways. */
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 10ch; }
  .stat .v { font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .k { font-size: 11px; color: var(--dim); }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  #age { min-width: 18ch; }
  .live { background: #14532d; color: var(--ok); }
  .stale { background: #422006; color: var(--warn); }
  .down { background: #450a0a; color: var(--bad); }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
  button, select {
    background: #262b33; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  button:hover, select:hover { border-color: #3d4452; }
  button[aria-pressed="true"] { background: var(--accent); color: #07121a; border-color: var(--accent); }
  .grow { flex: 1; }
  label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

  /* Sky plot */
  #sky { width: 100%; height: auto; display: block; }

  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 3px 6px 6px 0; }
  td { padding: 2px 6px 2px 0; font-variant-numeric: tabular-nums; }
  .muted { color: var(--dim); }
  #note { color: var(--warn); }
  footer { grid-column: 1 / -1; color: var(--dim); font-size: 11px; }
  .uplot { width: 100% !important; }
  /* The journal is three tables of mostly text in one panel, so it
     scrolls on its own rather than pushing the chart off the screen. */
  /* One readout for the whole stack, since the cursor is one cursor. */
  #readout { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline;
             min-height: 1.4em; font-size: 12px; font-variant-numeric: tabular-nums; }
  #readout .w { color: var(--dim); }
  #readout .k { color: var(--dim); }
  #readout .v { color: var(--text); }
  #journal { max-height: 20rem; overflow-y: auto; }
  #journal table { font-variant-numeric: tabular-nums; }
  #journal td:first-child { color: var(--dim); white-space: nowrap; padding-right: 10px; }
  #journal-tabs button.on { background: var(--line); color: var(--fg); }
  /* The panel heading sits on the controls row here, so it drops the
     bottom margin the standalone headings keep. */
  .controls h2 { margin: 0; }
</style>

<div class="panel full" id="status"><span class="muted">connecting...</span></div>

<div class="panel">
  <div class="controls">
    <span id="columns"></span>
    <span class="grow"></span>
    <span id="ranges"></span>
    <button id="reset" title="Back to the last hour">reset</button>
  </div>
  <div id="charts"></div>
  <div id="readout"></div>
  <div id="note"></div>
</div>

<div class="panel">
  <h2>Sky</h2>
  <canvas id="sky" width="320" height="320"></canvas>
  <table id="sats"><tbody class="muted"><tr><td>waiting...</td></tr></tbody></table>
</div>

<div class="panel full">
  <div class="controls">
    <h2>What the receiver recorded</h2>
    <span class="grow"></span>
    <span id="journal-tabs"></span>
  </div>
  <div id="journal"><span class="muted">waiting...</span></div>
</div>

<footer id="about"></footer>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script>
"use strict";

// The chart library is fetched from a CDN, so say so plainly rather
// than leaving an empty rectangle if it did not arrive.
const haveUplot = typeof uPlot !== "undefined";

const RANGES = [
  ["1h", 3600], ["6h", 21600], ["24h", 86400],
  ["7d", 604800], ["30d", 2592000], ["all", null],
];
// The sky plot's dimensions, in pixels.
const MARGIN = 20;      // room for the cardinal labels and a rim dot

// The sky grid is drawn darker than the data and lighter than a panel
// border.  It was --line, which is the 1px border colour: right for
// separating boxes, far too dim for lines somebody reads an angle off.
// The horizon is the boundary of the plot, so it is stronger than the
// elevation rings inside it.
const SKY_GRID = "#39414f";
const SKY_HORIZON = "#515b6b";
const DOT_MIN = 4;      // a satellite with no signal reading
const DOT_RANGE = 7;    // added at the strongest signal in the frame

// Label, and the factor that puts the column in units worth reading.
// The interval is stored in seconds and is a few nanoseconds: plotted
// as seconds, every axis tick rounds to 0.
const LABELS = {
  efc_percent: ["EFC, percent of range", 1],
  efc_dac: ["EFC, raw counts", 1],
  temperature_c: ["Internal temperature, C", 1],
  oven_current: ["Oven current", 1],
  oven_tempco: ["Oscillator tempco, learned", 1],
  time_interval_s: ["1 PPS TI, ns", 1e9],
  tfom: ["Time figure of merit", 1],
  ffom: ["Frequency figure of merit", 1],
};
const pad = (n) => String(n).padStart(2, "0");
const label = (c) => (LABELS[c] ?? [c, 1])[0];
const factor = (c) => (LABELS[c] ?? [c, 1])[1];
const scaled = (values, c) =>
  factor(c) === 1 ? values : values.map((v) => (v === null ? null : v * factor(c)));

// The view is taken from the URL so a particular one can be kept: a
// link to "EFC against temperature over the last day" is worth more
// than a description of how to click to it.
const view = new URLSearchParams(location.search);

let charts = [];
let span = view.has("range") ? Number(view.get("range")) || null : 3600;
let zoom = null;          // [from, to] once the user has dragged
// Several series, stacked, sharing one time axis.  `column` singular is
// still read so an older bookmark still opens on what it named.
let columns = (view.get("columns") ?? view.get("column") ??
  "time_interval_s,efc_percent,temperature_c,oven_current")
  .split(",")
  .filter(Boolean);

// uPlot ties charts together by a shared key: hovering one moves the
// cursor on all of them, which is most of what makes a stack readable.
const SYNC = haveUplot ? uPlot.sync("smartclock") : null;

const $ = (id) => document.getElementById(id);
// Total: never rejects, never hangs.  A rejected fetch anywhere in the
// boot sequence used to abort it before the polling timer was
// installed, leaving the page stuck on "connecting..." until someone
// reloaded it -- the one failure that needed a human.
async function getJson(url) {
  try {
    const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
    return await response.json();
  } catch (e) {
    return { error: String(e) };
  }
}
// Everything interpolated into innerHTML goes through this.  The values
// are numbers and enums today, but they come from a string scraper over
// a serial line, and one field becoming an Option<String> upstream
// would otherwise make this page execute whatever the receiver said.
const esc = (v) =>
  String(v).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (v, digits = 3) =>
  v === null || v === undefined ? "--" : Number(v).toFixed(digits);

// ---------------------------------------------------------------- status

let ticking = false;
async function tick() {
  if (ticking) return;
  ticking = true;
  try {
    await poll();
  } finally {
    ticking = false;
  }
}

async function poll() {
  const s = await getJson("/api/snapshot");
  if (s.error) {
    lost("no daemon", s.error);
    return;
  }

  const state = s.freshness === "Live" ? ["live", "LIVE"]
              : s.freshness === "Stale" ? ["stale", "STALE"]
              : ["down", "DISCONNECTED"];
  // Age of the slowest group of fields: the honest headline, since the
  // rest of this strip is only as current as its least current part.
  const ages = ["fast", "medium", "slow"]
    .map((t) => s.polled?.[t]?.at)
    .filter(Boolean)
    .map((at) => (Date.now() - Date.parse(at)) / 1000);
  const oldest = ages.length ? Math.max(...ages) : null;

  // The receiver's own clock, not the browser's.  Shown as of the last
  // fast poll rather than ticking: a clock animated between polls
  // would be the page's arithmetic presented as the receiver's time.
  const utc = s.time
    ? `${pad(s.time.hour)}:${pad(s.time.minute)}:${pad(s.time.second)}`
    : "--";
  // The date beside the time of day, corrected.  Almost every receiver
  // of this vintage is behind by whole GPS epochs, so that is the
  // normal condition rather than a fault; it used to raise a pill in
  // the strip, which meant an amber warning permanently lit on a
  // healthy instrument.  The correction is noted under the value, and
  // the raw date is in the tooltip, because the arithmetic is ours and
  // done against the host clock rather than anything the receiver said.
  //
  // Only claimed when the corrected date is actually to hand.  A
  // daemon older than this page does not send one, and labelling its
  // raw date as corrected would be the one thing worse than showing
  // the raw date: saying it has been fixed when it has not.
  const epochs = s.date_corrected ? (s.date?.rollover?.epochs ?? 0) : 0;
  const dateKey = epochs
    ? `date, +${epochs} GPS epoch${epochs === 1 ? "" : "s"}`
    : s.date?.rollover
      ? "date, as the receiver reports it"
      : "date";
  const stats = [
    ["receiver UTC", utc],
    [dateKey, s.date_corrected ?? s.date?.raw ?? "--", s.date?.raw],
    ["mode", s.mode ?? "--"],
    ["TFOM / FFOM", `${s.tfom ?? "--"} / ${s.ffom ?? "--"}`],
    ["EFC", s.efc === null || s.efc === undefined ? "--" : fmt(s.efc, 3) + "%"],
    ["EFC raw", s.efc_raw ?? "--"],
    ["internal temp", s.temperature_c == null ? "--" : fmt(s.temperature_c, 2) + " C"],
    ["1 PPS TI", s.time_interval_ns === null ? "--" : fmt(s.time_interval_ns, 1) + " ns"],
    ["tracking", s.screen?.tracking ?? "--"],
  ];
  $("status").innerHTML =
    `<span class="pill ${state[0]}">${state[1]}</span>` +
    (oldest === null
      ? ""
      : `<span class="muted" id="age">oldest field ${Math.max(0, oldest).toFixed(0)}s</span>`) +
    stats
      .map(
        ([k, v, hint]) =>
          `<span class="stat"${hint ? ` title="the receiver reports ${esc(hint)}"` : ""}>` +
          `<span class="v">${esc(v)}</span><span class="k">${esc(k)}</span></span>`,
      )
      .join("") +
    (s.hardware_faults?.length
      ? `<span class="pill down">${s.hardware_faults.map(esc).join(", ")}</span>`
      : "") +
    // The receiver's own alarm, which is latched and stays latched
    // until cleared at the front panel.  Named separately where it is
    // a clock step, since that invalidates the measurements either
    // side of it and is not just another fault.
    (s.time_reset
      ? `<span class="pill down">receiver reset its clock to match GPS</span>`
      : "") +
    (s.alarming && !s.time_reset
      ? `<span class="pill stale">receiver alarm: ${(s.alarm_summary ?? []).map(esc).join(", ")}</span>`
      : "") +
    (s.screen?.satellites_suspect
      ? `<span class="pill stale">satellite table disagrees with its own counts</span>`
      : "") +
    "";

  sky(s.screen);
}

// Nothing is known any more.  The sky is cleared with the strip: a
// canvas still showing eight tracked satellites next to the words "no
// daemon" asserts a sky the receiver may not have, which is the one
// stale value a GPS tool must not show.
function lost(what, why) {
  $("status").innerHTML =
    `<span class="pill down">${esc(what)}</span>` +
    (why ? ` <span class="muted">${esc(why)}</span>` : "");
  sky(null);
}

// ------------------------------------------------------------------ sky

// A polar plot of what the receiver can see: north up, horizon at the
// rim, zenith at the middle.  This is the view the status screen's
// table implies and never shows.
function sky(screen) {
  const c = $("sky"), ctx = c.getContext("2d");
  const w = c.width, h = c.height, cx = w / 2, cy = h / 2, r = Math.min(cx, cy) - MARGIN;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#c2c8d2";
  ctx.font = "11px ui-monospace, monospace";
  ctx.textAlign = "center";

  // Elevation rings at 30 degree steps, the horizon last and brighter
  // so the edge of the plot reads as an edge.
  for (const elev of [60, 30, 0]) {
    ctx.strokeStyle = elev === 0 ? SKY_HORIZON : SKY_GRID;
    ctx.beginPath();
    ctx.arc(cx, cy, (r * (90 - elev)) / 90, 0, 2 * Math.PI);
    ctx.stroke();
  }
  ctx.strokeStyle = SKY_GRID;
  for (const [deg, name] of [[0, "N"], [90, "E"], [180, "S"], [270, "W"]]) {
    const a = ((deg - 90) * Math.PI) / 180;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    ctx.stroke();
    ctx.fillText(name, cx + (r + 10) * Math.cos(a), cy + (r + 10) * Math.sin(a) + 4);
  }

  const signals = (screen?.satellites ?? [])
    .map((s) => s.signal)
    .filter((v) => v != null && v > 0);
  const strongest = signals.length ? Math.max(...signals) : 0;

  const rows = [];
  for (const sat of screen?.satellites ?? []) {
    const state = sat.tracked ? "tracked" : sat.acquiring ? "acquiring" : "seen";
    rows.push(`<tr><td>${sat.prn}</td><td>${sat.elevation ?? "--"}</td>` +
              `<td>${sat.azimuth ?? "--"}</td><td>${sat.signal ?? "--"}</td>` +
              `<td class="muted">${state}</td></tr>`);
    // Below the horizon, or a reading the scraper could not make sense
    // of: either would land outside the plot.
    if (
      !Number.isFinite(sat.elevation) ||
      !Number.isFinite(sat.azimuth) ||
      sat.elevation < 0
    ) {
      continue;
    }
    const a = (sat.azimuth - 90) * Math.PI / 180;
    const d = r * (90 - sat.elevation) / 90;
    const x = cx + d * Math.cos(a), y = cy + d * Math.sin(a);
    // Scaled to the strongest satellite in this frame, because the
    // receiver's own scale is undocumented and differs between models
    // -- one reports 0 to 9, another 0 to 49.  Dividing by a fixed 255
    // made every dot the same size, which is what this looked like
    // before anyone measured it.
    const size =
      sat.signal == null || !strongest
        ? DOT_MIN
        : DOT_MIN + (sat.signal / strongest) * DOT_RANGE;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, 2 * Math.PI);
    ctx.fillStyle = sat.tracked ? "#4ade80" : sat.acquiring ? "#fbbf24" : "#6b7280";
    ctx.fill();
    ctx.fillStyle = "#e6e8eb";
    ctx.textAlign = x < cx ? "right" : "left";
    ctx.fillText(sat.prn, x + (x < cx ? -size - 3 : size + 3), y + 4);
    ctx.textAlign = "center";
  }
  $("sats").innerHTML =
    "<thead><tr><th>PRN</th><th>el</th><th>az</th><th>SS</th><th>state</th></tr></thead><tbody>" +
    (rows.join("") || `<tr><td class="muted">no satellite table yet</td></tr>`) +
    "</tbody>";
}

// ---------------------------------------------------------------- charts

async function fetchSeries(cols, from, to) {
  const q = new URLSearchParams({ columns: cols.join(","), points: 1500 });
  if (from) q.set("from", Math.round(from));
  if (to) q.set("to", Math.round(to));
  return getJson("/api/history?" + q);
}

// A y scale that begins and ends on a labelled gridline.
//
// uPlot scales to the data and then places round ticks inside it, so
// the top and bottom lines fall short by whatever the data happens to
// need -- by a different amount on every plot, which across a stack
// reads as ragged: a label at the top of one, none at the bottom of the
// next.  Snapping the scale itself to the tick step fixes it, at the
// cost of some empty space above and below the trace.
//
// Steps are 1, 2, 5 or 10 times a power of ten, so the labels are
// numbers a person would choose.  2.5 is excluded deliberately: it is a
// legitimate step and it produces axes like 35.925, which is not.
const TICK_COUNT_WEIGHT = 0.3;

function niceScale(min, max, target) {
  if (!isFinite(min) || !isFinite(max)) return null;
  // A series that never moved still needs an axis with room around it.
  //
  // "Never moved" cannot be exact equality.  A constant column still
  // arrives with a spread: SQLite averages each bucket, and summing
  // the same number repeatedly in floating point does not give it back
  // exactly.  Oven current held at 104.9 came through spanning 2e-14,
  // which is not flat by `===`, so the step came out at 1e-15 and the
  // axis read 104.900000000000020.  The learned tempco, which really
  // is constant on this hardware, would do the same.
  const noise = Math.max(Math.abs(min), Math.abs(max)) * 1e-9;
  if (max - min <= noise) {
    const pad = Math.max(Math.abs(min) * 0.05, 1);
    min -= pad;
    max += pad;
  }
  const span = max - min;
  const mag = Math.pow(10, Math.floor(Math.log10(span / target)));
  let best = null;
  for (const m of [1, 2, 5, 10]) {
    const step = m * mag;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const n = Math.round((hi - lo) / step);
    // Two lines is not an axis; nine is a grid.
    if (n < 2 || n > 8) continue;
    // Both matter and the balance is empirical.  Weighting the tick
    // count heavily gave internal temperature an axis of 30 to 45 for
    // data spanning 33.8 to 40.3 -- round, correctly bounded, and
    // using less than half the plot.  At this weight the same data
    // gets 32 to 42, which is still round and fills two thirds.
    const score = Math.abs(n - target) * TICK_COUNT_WEIGHT + (hi - lo - span) / span;
    if (!best || score < best.score) best = { lo, hi, step, n, score };
  }
  return best;
}

// How many gaps between labels suit a plot of this height.  About
// forty pixels each: closer and the labels crowd, further and a short
// plot ends up with two.
function tickTarget(height) {
  return Math.min(6, Math.max(3, Math.round(height / 40)));
}

// How tall each chart is, given how many there are.  One gets the room
// it always had; a stack divides a similar budget, with a floor below
// which a plot stops being readable.
function plotHeight(count) {
  return count === 1 ? 420 : Math.max(150, Math.round(560 / count));
}

let generation = 0;
async function draw() {
  const mine = ++generation;
  if (!haveUplot) {
    $("note").textContent =
      "The chart library did not load. It comes from a CDN, so this page needs internet access; the readings above do not.";
    return;
  }
  if (!columns.length) {
    for (const c of charts) c.destroy();
    charts = [];
    $("charts").innerHTML = "";
    $("readout").innerHTML = "";
    $("note").textContent = "nothing selected";
    return;
  }
  let to = null, from = null;
  if (zoom) { [from, to] = zoom; }
  else if (span) { to = Date.now() / 1000; from = to - span; }

  let got = await fetchSeries(columns, from, to);
  // A later draw has started; this one's data belongs to a selection or
  // a range nobody is looking at any more.
  if (mine !== generation) return;

  // How far back the log goes is only knowable once it has been asked,
  // so "all" costs a second request: the first answers with the
  // server's default hour and the extent, the second asks for the
  // extent.  Without this the button quietly showed the last hour --
  // the range it names is the one range it did not fetch.
  if (!span && !zoom && got.first && got.last > got.first) {
    got = await fetchSeries(columns, got.first, got.last);
    if (mine !== generation) return;
  }
  if (got.error) { $("note").textContent = got.error; return; }
  $("note").textContent = got.at.length ? "" : "no readings in this range";

  for (const c of charts) c.destroy();
  charts = [];
  $("charts").innerHTML = "";

  const height = plotHeight(got.plots.length);
  got.plots.forEach((plot, n) => {
    const col = plot.column;
    const mean = scaled(plot.mean, col);
    const low = scaled(plot.min, col);
    const high = scaled(plot.max, col);
    // The scale has to cover the envelope, not just the mean: the
    // min and max are drawn, and an axis that ends below them would
    // clip the very excursions they exist to show.
    const values = [...low, ...high, ...mean].filter((v) => v != null && isFinite(v));
    const nice = values.length
      ? niceScale(Math.min(...values), Math.max(...values), tickTarget(height))
      : null;
    const places = nice ? Math.max(0, -Math.floor(Math.log10(nice.step))) : 0;
    const ticks = [];
    if (nice) {
      for (let i = 0; i <= nice.n; i++) ticks.push(nice.lo + i * nice.step);
    }
    // Wide enough for the longest label this axis will actually draw.
    // Measured from the ticks rather than from the data, since a tick
    // can be wider than every value under it.  The default gutter
    // silently clips instead of overflowing, which turned an EFC of
    // 712,793 into an axis reading 12,793 -- a plausible number, wrong
    // by seven hundred thousand.
    const widest = Math.max(
      ...(ticks.length ? ticks : [0]).map((v) => tickLabel(v, places).length),
      4,
    );
    // Only the bottom chart carries the time labels.  Repeating them
    // under every plot costs the height that makes the stack worth
    // having, and says the axes might differ when the whole point is
    // that they cannot.
    const last = n === got.plots.length - 1;
    const host = document.createElement("div");
    $("charts").appendChild(host);

    const opts = {
      width: $("charts").clientWidth || 800,
      height,
      title: label(col),
      series: [
        {},
        { label: "min", stroke: "#0e7490", width: 1, points: { show: false } },
        { label: "max", stroke: "#0e7490", width: 1, points: { show: false } },
        { label: label(col), stroke: "#38bdf8", width: 1.5, points: { show: false } },
      ],
      axes: [
        {
          stroke: "#8b929c",
          grid: { stroke: "#2b3038" },
          ticks: { stroke: "#2b3038" },
          show: last,
        },
        {
          stroke: "#38bdf8",
          grid: { stroke: "#2b3038" },
          ticks: { stroke: "#2b3038" },
          size: 30 + widest * 8,
          // The ticks the scale was snapped to, so the lines and the
          // range cannot disagree.
          ...(nice
            ? {
                splits: () => ticks,
                values: (u, vals) => vals.map((v) => tickLabel(v, places)),
              }
            : {}),
        },
      ],
      scales: {
        x: { time: true },
        ...(nice ? { y: { range: [nice.lo, nice.hi] } } : {}),
      },
      // No per-chart legend.  With the cursor synced there is one
      // instant being pointed at, not one per plot, so the values
      // belong in one row -- and `show: last` meant only the bottom
      // plot had any readout at all, which is the opposite of what
      // aligning them is for.
      legend: { show: false },
      cursor: {
        drag: { x: true, y: false },
        // Every chart moves together, which is what makes reading one
        // value across the stack possible at all.
        sync: { key: SYNC.key, setSeries: false },
      },
      hooks: {
        // setSelect, not setScale.  setScale also fires when uPlot sets
        // the scale from the data it was just given, which is every
        // draw: the hook then decided the user had zoomed, latched the
        // range, unlit every preset button and -- because the
        // background refresh is skipped while zoomed -- stopped the
        // history updating for the life of the page.  setSelect fires
        // only for a drag.
        setCursor: [() => readout()],
        setSelect: [(u) => {
          if (u.select.width <= 0) return;
          zoom = [
            u.posToVal(u.select.left, "x"),
            u.posToVal(u.select.left + u.select.width, "x"),
          ];
          span = null;
          buttons();
          load();
        }],
      },
    };
    const chart = new uPlot(
      opts,
      [got.at, scaled(plot.min, col), scaled(plot.max, col), mean],
      host,
    );
    // Which column this chart is, so the shared readout can label it
    // without reaching back into the request that built it.
    chart.smartclockColumn = col;
    chart.over.addEventListener("dblclick", () => {
      zoom = null;
      buttons();
      load();
    });
    charts.push(chart);
  });
  // Say what the row is for before anything has been hovered, rather
  // than leaving an empty strip that looks like a rendering fault.
  readout();
}

// One tick label, at the precision its step implies.  Fixed places
// rather than toLocaleString's default, or a step of 0.05 renders as
// 35.9 and 36 and the axis looks unevenly spaced when it is not.
//
// Not `tick`: that name was already taken by the status-strip poller
// above, and a second declaration of it silently replaced the first --
// so boot called this with no arguments, threw on undefined, and left
// the strip reading "connecting..." for ever while the charts drew
// fine.
function tickLabel(v, places) {
  return v.toLocaleString(undefined, {
    minimumFractionDigits: places,
    maximumFractionDigits: places,
  });
}

// One value per series at the instant the cursor is on, plus the time
// once.  Built here rather than left to uPlot because its legend is per
// chart, and a stack sharing a cursor wants a readout that shares it
// too.
function readout() {
  const el = $("readout");
  if (!charts.length) { el.innerHTML = ""; return; }
  // Synced, so whichever chart is under the pointer has the index and
  // the rest agree; when the pointer leaves, none of them do.
  const idx = charts.map((c) => c.cursor.idx).find((i) => i != null);
  if (idx == null) {
    el.innerHTML = `<span class="w">hover a plot for the values at that instant</span>`;
    return;
  }
  const at = new Date(charts[0].data[0][idx] * 1000);
  const cells = charts.map((c) => {
    const v = c.data[3][idx];
    const shown = v == null ? "--" : v.toLocaleString(undefined, { maximumFractionDigits: 3 });
    return `<span><span class="k">${esc(label(c.smartclockColumn))}</span> ` +
           `<span class="v">${esc(shown)}</span></span>`;
  });
  el.innerHTML = `<span class="v">${esc(at.toLocaleTimeString())}</span>` + cells.join("");
}

// The series menu, built from what the server says it can serve rather
// than from a copy here that can drift out of step with PLOTTABLE.
function pickers(plottable) {
  $("columns").innerHTML = plottable
    .map(
      (c) =>
        `<label><input type="checkbox" data-col="${c}"` +
        `${columns.includes(c) ? " checked" : ""}> ${esc(label(c))}</label>`,
    )
    .join(" ");
  for (const box of $("columns").querySelectorAll("input")) {
    box.onchange = () => {
      const col = box.dataset.col;
      // Kept in the menu's order rather than the order they were
      // ticked, so the stack does not reshuffle as it is built.
      columns = plottable.filter(
        (c) => (c === col ? box.checked : columns.includes(c)),
      );
      load();
    };
  }
}

let pending = null;
function load() {
  // Coalesce: dragging fires setScale repeatedly.
  clearTimeout(pending);
  pending = setTimeout(draw, 120);
}

function buttons() {
  $("ranges").innerHTML = RANGES
    .map(([label, secs]) =>
      `<button data-secs="${secs}" aria-pressed="${!zoom && span === secs}">${label}</button>`)
    .join(" ");
  for (const b of $("ranges").querySelectorAll("button")) {
    b.onclick = () => {
      span = b.dataset.secs === "null" ? null : Number(b.dataset.secs);
      zoom = null;
      buttons();
      load();
    };
  }
}

// ------------------------------------------------- the receiver's journal

// Three streams the snapshot table does not carry and no chart can
// show: what the receiver wrote in its own diagnostic log, the
// transitions taken from its event registers, and what its error queue
// held.  Tabbed rather than stacked because they are read one at a
// time and the panel would otherwise own the page.
const JOURNAL = [
  ["events", "transitions"],
  ["entries", "receiver log"],
  ["errors", "error queue"],
];
// Chosen on first draw as the first stream that has anything, unless
// the URL names one.  Defaulting to a fixed tab meant landing on an
// empty "transitions" and reading "nothing recorded" with a hundred
// log entries one tab away.
let stream = view.get("journal");

// The receiver's calendar can be behind by whole GPS epochs, so its own
// stamps are shown as written and never silently corrected -- the
// correction belongs where the rollover is known, not here.
const rows = {
  events: (r) => [local(r.at), `${esc(r.decoded)} <span class="muted">(${esc(r.register)} ${r.bits})</span>`],
  entries: (r) => [esc(r.stamp) || local(r.at), `<span class="muted">#${r.entry}</span> ${esc(r.message)}`],
  errors: (r) => [local(r.at), `<span class="muted">${r.code}</span> ${esc(r.message)}`],
};

const local = (iso) => {
  const at = new Date(iso);
  return isNaN(at) ? esc(iso) : esc(at.toLocaleString());
};

function drawJournal(journal) {
  if (stream === null || !(journal[stream] ?? []).length) {
    stream = JOURNAL.map(([key]) => key).find((key) => journal[key]?.length) ?? "events";
  }
  $("journal-tabs").innerHTML = JOURNAL.map(
    ([key, name]) =>
      `<button data-stream="${key}" class="${key === stream ? "on" : ""}">${name}` +
      ` (${journal[key]?.length ?? 0})</button>`,
  ).join(" ");
  for (const button of $("journal-tabs").querySelectorAll("button")) {
    button.onclick = () => {
      // Deliberate, so an empty tab the operator chose stays chosen
      // rather than being redirected by the rule above.
      stream = button.dataset.stream;
      $("journal-tabs")
        .querySelectorAll("button")
        .forEach((b) => b.classList.toggle("on", b.dataset.stream === stream));
      showStream(journal);
    };
  }
  showStream(journal);
}

function showStream(journal) {
  const list = journal[stream] ?? [];
  $("journal").innerHTML = list.length
    ? `<table><tbody>${list
        .map((r) => `<tr><td>${rows[stream](r)[0]}</td><td>${rows[stream](r)[1]}</td></tr>`)
        .join("")}</tbody></table>`
    : `<span class="muted">nothing recorded</span>`;
}

async function loadJournal() {
  const journal = await getJson("/api/journal");
  if (journal.error) {
    $("journal").innerHTML = `<span class="muted">${esc(journal.error)}</span>`;
    return;
  }
  drawJournal(journal);
}

// ------------------------------------------------------------------ boot

(async function () {
  const info = await getJson("/api/info");
  $("about").textContent = info.error
    ? info.error
    : [info.identity, info.dialect, `smartclockd ${info.version ?? "?"}`, "read only"]
        .filter(Boolean)
        .join("  --  ");

  // One request before the first draw, to learn what may be plotted.
  // Asked of the server rather than listed here, so the menu cannot
  // drift from the columns the query will actually accept.
  const first = await fetchSeries(columns, null, null);
  pickers(first.plottable ?? columns);
  $("reset").onclick = () => { zoom = null; span = 3600; buttons(); load(); };

  buttons();
  await draw();
  await tick();
  await loadJournal();
  // Slower than the chart: the receiver writes to its log in events per
  // day, not per second, and this is a whole-table redraw.
  setInterval(loadJournal, 60000);
  setInterval(tick, 1000);
  // History moves slowly next to the live tiles; redrawing it every
  // second would fight with the cursor for no gain.
  setInterval(() => { if (!zoom) load(); }, 30000);
  addEventListener("resize", load);
})();
</script>
