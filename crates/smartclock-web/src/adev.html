<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartClock stability</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css"
      integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE"
      crossorigin="anonymous">

<link rel="stylesheet" href="/style.css">

<div class="panel" id="status"><span class="muted">connecting...</span></div>

<nav class="panel nav">
  <a href="/">Live</a>
  <a href="/sky">Sky</a>
  <a href="/adev" aria-current="page">Stability</a>
</nav>

<div class="panel" id="unit-bar" hidden>
  <div class="controls">
    <label for="unit">Receiver</label>
    <select id="unit"></select>
    <span class="grow"></span>
    <span id="unit-seen" class="muted"></span>
  </div>
</div>

<div class="panel" id="state"><span class="muted">loading...</span></div>

<div class="panel">
  <div class="controls">
    <h2>Stability</h2>
    <span class="grow"></span>
    <span id="ranges"></span>
    <button id="reset" title="Whole curve, last hour">reset</button>
  </div>
  <div id="pane">
    <div id="chart"></div>
  </div>
  <div id="table-wrap">
    <table id="table"><tbody class="muted"><tr><td>loading...</td></tr></tbody></table>
  </div>
  <p class="muted note" id="caveat"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script src="/status.js"></script>
<script>

// Ranges to measure over, as seconds back from now.  Longer than the
// history page offers, because a deviation at a long tau needs a long
// run and there is no point offering a window that cannot produce one.
const RANGES = [
  ["1h", 3600], ["6h", 21600], ["24h", 86400],
  ["7d", 604800], ["30d", 2592000], ["all", null],
];

// Both axes are decades, which is the only way this curve is read: the
// slope between decades is what names the noise.
const LOG = { distr: 3, log: 10 };

// The plot fills what the pane has left after the table, between these
// bounds.  uPlot draws its text at a fixed size however wide the plot
// is, so width buys plotting area rather than magnifying everything --
// which is the difference between this and scaling a drawing to fit.
const PLOT = { min: 360, ratio: 2.5, shortest: 300, tallest: 560 };

let chart = null;
let range = 3600;

// Measured on the pane, never on the chart itself: the chart is a flex
// item that is emptied before being rebuilt, and measuring it at that
// moment collapses it to its min-content width -- which is how a 720
// pixel plot came out at 165.
function width() {
  return Math.max(PLOT.min, $("pane").clientWidth || 800);
}

// Height follows width rather than being fixed, so the curve keeps its
// shape on any window: at a fixed height a wide plot flattens a slope
// that has not changed, which on a log-log chart is the one thing the
// reader is meant to judge by eye.  Bounded at both ends, because the
// ratio alone would make a very wide window very tall.
function height(w) {
  return Math.round(
    Math.max(PLOT.shortest, Math.min(PLOT.tallest, w / PLOT.ratio)),
  );
}

// A value as a mantissa and a power, for the readout and the table,
// where the exact figure matters and a bare decade would not do.
function decade(v) {
  if (!Number.isFinite(v) || v <= 0) return "--";
  const exponent = Math.floor(Math.log10(v));
  const mantissa = v / 10 ** exponent;
  return `${mantissa.toFixed(mantissa < 10 ? 1 : 0)}×${power(10 ** exponent)}`;
}

// A log ruler: a graduation at every 1 to 9 of each decade, so the
// spacing between them shows the scale is logarithmic and a point can
// be read off between labels.  uPlot's own splits label 1, 2 and 5 of
// each decade, which is what made the axis look busy -- the answer is
// fewer labels, not fewer graduations, so only the decades are named.
//
// A span too narrow to hold two decades keeps uPlot's own splits,
// rather than being given an axis with one mark on it.
function graduations(u, axis, min, max) {
  const first = Math.floor(Math.log10(min) - 1e-9);
  const last = Math.ceil(Math.log10(max) + 1e-9);
  if (last - first < 2) return null;
  const out = [];
  for (let e = first; e <= last; e++) {
    for (let m = 1; m < 10; m++) {
      const v = m * 10 ** e;
      if (v >= min * (1 - 1e-9) && v <= max * (1 + 1e-9)) out.push(v);
    }
  }
  return out.length > 1 ? out : null;
}

// Whether a graduation is a whole decade, and so the one that is
// named.  Compared as a rounded exponent rather than by dividing,
// because 1e-9 divided out does not land exactly on 1.
function whole(v) {
  const e = Math.round(Math.log10(v));
  return Math.abs(v / 10 ** e - 1) < 1e-6;
}

// A decade of sigma_y, which is dimensionless and always small.
// Written 10 to the power rather than as 1e-9, which is a programming
// language's spelling of a number rather than a physicist's.
const SUPERSCRIPT = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²",
                      3: "³", 4: "⁴", 5: "⁵", 6: "⁶",
                      7: "⁷", 8: "⁸", 9: "⁹" };
function power(v) {
  if (!Number.isFinite(v) || v <= 0) return "";
  const exponent = String(Math.round(Math.log10(v)));
  return "10" + [...exponent].map((c) => SUPERSCRIPT[c]).join("");
}

// A decade as the number itself: 1, 10, 100, 1000.  Past six figures
// the exponent is shorter than the number and just as readable.
function plain(v) {
  if (!Number.isFinite(v) || v <= 0) return "";
  const exponent = Math.round(Math.log10(v));
  return exponent < 6 ? String(10 ** exponent) : `1e${exponent}`;
}

function seconds(v) {
  if (!Number.isFinite(v)) return "--";
  if (v >= 86400) return `${(v / 86400).toFixed(v < 864000 ? 1 : 0)} d`;
  if (v >= 3600) return `${(v / 3600).toFixed(1)} h`;
  if (v >= 60) return `${(v / 60).toFixed(1)} m`;
  return `${v.toFixed(v < 10 ? 2 : 0)} s`;
}

// The table's averaging times, always in seconds, never minutes or
// hours.
function inSeconds(v) {
  if (!Number.isFinite(v)) return "--";
  return `${v.toFixed(v < 10 ? 2 : 0)} s`;
}

function draw(points) {
  if (chart) {
    chart.destroy();
    chart = null;
  }
  $("chart").innerHTML = "";
  if (!points.length) {
    $("chart").innerHTML = `<p class="muted pad">nothing to plot in this range</p>`;
    return;
  }
  if (typeof uPlot === "undefined") {
    $("chart").innerHTML =
      `<p class="muted pad">the chart library did not load; the table has the numbers</p>`;
    return;
  }
  const size = { width: width(), height: 0 };
  size.height = height(size.width);
  // Three curves.  The modified deviation is the one this record
  // supports exactly -- the receiver's reading is already a ten-second
  // mean, which is the innermost block of the modified form's own
  // averaging -- so it leads; the plain Allan deviation is drawn dim
  // beside it because data sheets quote that one; and the time
  // deviation, in seconds, has an axis of its own on the right.  A
  // point the modified form lacks (it needs three whole windows) is a
  // hole in its series, which uPlot leaves as a break in the line.
  const modified = points.map((p) => (p.modified ? p.modified.deviation : null));
  const time = points.map((p) => (p.modified ? p.modified.time : null));
  chart = new uPlot(
    {
      width: size.width,
      height: size.height,
      title: "Stability of the 1 PPS against GPS",
      scales: { x: LOG, y: LOG, t: LOG },
      axes: [
        {
          scale: "x",
          stroke: "#8b929c",
          grid: { stroke: "#2b3038" },
          label: "averaging time τ, seconds",
          labelSize: 26,
          splits: graduations,
          values: (_, splits) => splits.map((v) => (whole(v) ? plain(v) : null)),
        },
        {
          scale: "y",
          stroke: "#8b929c",
          grid: { stroke: "#2b3038" },
          size: 62,
          label: "deviation σy",
          labelSize: 26,
          splits: graduations,
          values: (_, splits) => splits.map((v) => (whole(v) ? power(v) : null)),
        },
        {
          scale: "t",
          side: 1,
          stroke: "#8b929c",
          grid: { show: false },
          size: 62,
          label: "time deviation σx, seconds",
          labelSize: 26,
          splits: graduations,
          values: (_, splits) => splits.map((v) => (whole(v) ? power(v) : null)),
        },
      ],
      series: [
        { label: "τ", value: (_, v) => seconds(v) },
        {
          label: "MDEV",
          stroke: "#38bdf8",
          width: 1.5,
          points: { show: true, size: 5 },
          value: (_, v) => decade(v),
        },
        {
          label: "ADEV",
          stroke: "#8b929c",
          width: 1,
          dash: [6, 4],
          points: { show: true, size: 4 },
          value: (_, v) => decade(v),
        },
        {
          label: "TDEV",
          scale: "t",
          stroke: "#f59e0b",
          width: 1,
          points: { show: true, size: 4 },
          value: (_, v) => (Number.isFinite(v) ? `${decade(v)} s` : "--"),
        },
      ],
      // uPlot's legend is a live cursor readout, which is worth having
      // on a curve whose points are decades apart and hard to read off
      // an axis.  It confused because it was labelled "tau" and
      // "sigma_y" under a single trace, as though two things were
      // plotted; the symbols say plainly that these are the two
      // coordinates of the point under the cursor.
      legend: { show: true, live: true },
      cursor: { points: { size: 8 } },
    },
    [points.map((p) => p.tau), modified, points.map((p) => p.deviation), time],
    $("chart"),
  );
  // uPlot drags to zoom by default, and on two log axes it is easy to
  // end up somewhere with no way back.  Double click returns to the
  // whole curve, as it does on the history page.
  chart.over.addEventListener("dblclick", () => {
    chart.setScale("x", { min: null, max: null });
    chart.setScale("y", { min: null, max: null });
    chart.setScale("t", { min: null, max: null });
  });
}

function table(d) {
  if (!d.points.length) {
    $("table").innerHTML =
      `<tbody class="muted"><tr><td>` +
      `not enough unbroken readings here to measure anything` +
      `</td></tr></tbody>`;
    return;
  }
  $("table").innerHTML =
    "<thead><tr><th>averaging time</th>" +
    `<th title="modified Allan deviation: exact for these readings, ` +
    `which are already ten-second means">MDEV</th>` +
    `<th title="time deviation, τ·MDEV/√3">TDEV</th>` +
    `<th title="overlapping Allan deviation, as data sheets quote it; ` +
    `low at the shortest τ because the readings are averaged">ADEV</th>` +
    `<th title="second differences behind ADEV / averaged triples behind ` +
    `MDEV; each needs its readings present, which is what a gap takes ` +
    `away">differences</th>` +
    "</tr></thead><tbody>" +
    d.points
      .map(
        (p) =>
          `<tr><td>${esc(inSeconds(p.tau))}</td>` +
          `<td>${p.modified ? esc(decade(p.modified.deviation)) : "--"}</td>` +
          `<td>${p.modified ? esc(decade(p.modified.time)) + " s" : "--"}</td>` +
          `<td>${esc(decade(p.deviation))}</td>` +
          `<td class="muted">${p.differences} / ${p.modified ? p.modified.averages : "--"}</td></tr>`,
      )
      .join("") +
    "</tbody>";
}

// Which load is the latest.  A long range can take longer to measure
// than a short one asked for after it, and the slower answer must not
// land on top of the one the reader is now looking at.
let latest = 0;

async function load() {
  const mine = ++latest;
  $("state").innerHTML = `<span class="pill">measuring...</span>`;
  const q = new URLSearchParams();
  if (range === null) {
    q.set("from", "0");
    q.set("to", "2000000000");
  } else {
    q.set("from", String(Math.floor(Date.now() / 1000) - range));
  }
  try {
    const r = await fetch(`/api/adev?${withUnit(q)}`);
    if (!r.ok) throw new Error(`the server answered ${r.status}`);
    const d = await r.json();
    if (mine !== latest) return;
    // A failure the server could describe comes back as 200 with an
    // error in it, not as an HTTP status.
    if (d.error) throw new Error(d.error);
    draw(d.points);
    table(d);
    // Coverage travels with the curve because the curve cannot show
    // it: one drawn from a run that is mostly holes, or that broke into
    // forty pieces, looks exactly like one drawn from a clean day.
    const total = d.present + d.holes;
    const complete = total ? ((100 * d.present) / total).toFixed(1) : "0.0";
    const stat = (v, k) =>
      `<span class="stat"><span class="v">${esc(v)}</span>` +
      `<span class="k">${esc(k)}</span></span>`;
    $("state").innerHTML =
      stat(d.present, "readings") +
      stat(seconds(d.tau0), "spacing") +
      stat(d.segments, "unbroken runs") +
      stat(`${complete}%`, "complete") +
      stat(d.holes, "holes") +
      (d.truncated
        ? ` <span class="pill stale">longer than one measurement reads; this is its newest part</span>`
        : "");
  } catch (e) {
    if (mine !== latest) return;
    draw([]);
    table({ points: [] });
    $("state").innerHTML = `<span class="pill down">${esc(e.message)}</span>`;
  }
}

$("reset").onclick = () => {
  range = 3600;
  for (const b of $("ranges").querySelectorAll("button")) {
    b.toggleAttribute("aria-current", b.dataset.span === "3600");
  }
  load();
};

$("ranges").innerHTML = RANGES.map(
  ([label, secs]) => `<button data-span="${secs}">${label}</button>`,
).join(" ");
for (const button of $("ranges").querySelectorAll("button")) {
  button.onclick = () => {
    range = button.dataset.span === "null" ? null : Number(button.dataset.span);
    for (const other of $("ranges").querySelectorAll("button")) {
      other.toggleAttribute("aria-current", other === button);
    }
    load();
  };
}

// Said once, plainly, because the number on the chart is not the number
// most people come looking for.
$("caveat").textContent =
  "The interval measured is between the 1 PPS from the GPS receiver, " +
  "which is quantized to that receiver's own crystal, and a 1 PPS " +
  "divided down from the OCXO. While locked, the OCXO is steered to " +
  "follow it. Each reading is the receiver's own mean of ten seconds, " +
  "which the modified deviation absorbs exactly and the plain Allan " +
  "deviation does not: its first points are low where phase noise " +
  "dominates, and it is right from about ten readings up.";

addEventListener("resize", () => {
  if (!chart) return;
  const w = width();
  chart.setSize({ width: w, height: height(w) });
});

chooseReceiver(load).then(load);
</script>
