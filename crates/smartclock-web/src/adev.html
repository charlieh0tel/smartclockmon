<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartClock stability</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css"
      integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE"
      crossorigin="anonymous">

<link rel="stylesheet" href="/style.css">

<div class="panel" id="status"><span class="muted">connecting...</span></div>

<nav class="panel nav">
  <a href="/">Live</a>
  <a href="/sky">Sky</a>
  <a href="/adev" aria-current="page">Stability</a>
</nav>

<div class="panel" id="unit-bar" hidden>
  <div class="controls">
    <label for="unit">Receiver</label>
    <select id="unit"></select>
    <span class="grow"></span>
    <span id="unit-seen" class="muted"></span>
  </div>
</div>

<div class="panel" id="state"><span class="muted">loading...</span></div>

<div class="panel">
  <div class="controls">
    <h2>Stability</h2>
    <span class="grow"></span>
    <span id="series"></span>
    <span id="ranges"></span>
  </div>
  <div id="pane">
    <div id="chart"></div>
    <div id="chart-tdev"></div>
  </div>
  <div id="table-wrap">
    <table id="table"><tbody class="muted"><tr><td>loading...</td></tr></tbody></table>
  </div>
  <p class="muted note" id="caveat"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script src="/status.js"></script>
<script>

// Both axes are decades, which is the only way this curve is read: the
// slope between decades is what names the noise.
const LOG = { distr: 3, log: 10 };
// The tau axis is padded a few percent past the data, so a curve that
// starts at 10.0004 s -- the receiver's ten-second cadence is not
// exactly ten -- still gets its graduation at 10.
const TAU_SCALE = { ...LOG, range: (_, min, max) => [min / 1.05, max * 1.05] };

// uPlot's axis text defaults to 12px, which is small for numbers that
// are read off, not just glanced at.
const AXIS_FONT = "14px system-ui, sans-serif";

// The plot fills what the pane has left after the table, between these
// bounds.  uPlot draws its text at a fixed size however wide the plot
// is, so width buys plotting area rather than magnifying everything --
// which is the difference between this and scaling a drawing to fit.
const PLOT = { min: 360, ratio: 2.5, shortest: 300, tallest: 560 };

// Which curves are drawn, as the history page's column picker does it:
// checkboxes on the controls row, the choice kept in the address so a
// reload or a shared link shows the same curves.  MTIE is off unless
// asked for: a worst case is often the same number at every tau, and
// it sets the axis so that TDEV is squashed into the bottom decade.
const SERIES = ["MDEV", "ADEV", "TDEV", "MTIE"];
const DEFAULT_SERIES = ["MDEV", "ADEV", "TDEV"];
const view = new URLSearchParams(location.search);
let shown = new Set(
  (view.get("series") ?? DEFAULT_SERIES.join(","))
    .split(",")
    .filter((name) => SERIES.includes(name)),
);

// Where each curve lives: which chart, and its series index there.
function placed(name) {
  return { MDEV: [0, 1], ADEV: [0, 2], TDEV: [1, 1], MTIE: [1, 2] }[name];
}

function rememberSeries() {
  const q = new URLSearchParams(location.search);
  q.set("series", SERIES.filter((name) => shown.has(name)).join(","));
  history.replaceState(null, "", `${location.pathname}?${q}`);
}

function picker() {
  $("series").innerHTML = SERIES.map(
    (name) =>
      `<label><input type="checkbox" data-series="${name}"` +
      `${shown.has(name) ? " checked" : ""}> ${name}</label>`,
  ).join(" ");
  for (const box of $("series").querySelectorAll("input")) {
    box.onchange = () => {
      const name = box.dataset.series;
      if (box.checked) {
        shown.add(name);
      } else {
        shown.delete(name);
      }
      const [which, idx] = placed(name);
      const u = [chart, tdevChart][which];
      if (u) u.setSeries(idx, { show: box.checked });
      rememberSeries();
    };
  }
}

// The legend toggles a series too; keep the boxes telling the truth.
function followLegend(which) {
  return (u, idx, opts) => {
    if (idx === 0 || !opts || typeof opts.show !== "boolean") return;
    const name = SERIES.find((n) => {
      const [w, i] = placed(n);
      return w === which && i === idx;
    });
    if (!name) return;
    if (opts.show) {
      shown.add(name);
    } else {
      shown.delete(name);
    }
    const box = $("series").querySelector(`input[data-series="${name}"]`);
    if (box) box.checked = opts.show;
    rememberSeries();
  };
}

let chart = null;
// The time deviation and the maximum time interval error on a chart of
// their own under the first: both are in seconds where the deviations
// are dimensionless, and TDEV rises where they fall, so sharing their
// plot through a second axis paired the wrong curve with the wrong
// scale by eye.  The two charts share tau and a cursor.
let tdevChart = null;
// The range is the record the estimator runs on, not a viewport, so a
// change recomputes; the control is the shared one in status.js and
// the choice rides in the address beside the receiver and the series.
readRange(3600);
const SYNC = "stability";

// Measured on the pane, never on the chart itself: the chart is a flex
// item that is emptied before being rebuilt, and measuring it at that
// moment collapses it to its min-content width -- which is how a 720
// pixel plot came out at 165.
function width() {
  return Math.max(PLOT.min, $("pane").clientWidth || 800);
}

// Height follows width rather than being fixed, so the curve keeps its
// shape on any window: at a fixed height a wide plot flattens a slope
// that has not changed, which on a log-log chart is the one thing the
// reader is meant to judge by eye.  Bounded at both ends, because the
// ratio alone would make a very wide window very tall.
function height(w) {
  return Math.round(
    Math.max(PLOT.shortest, Math.min(PLOT.tallest, w / PLOT.ratio)),
  );
}

// A value as a mantissa and a power, for the readout and the table,
// where the exact figure matters and a bare decade would not do.
function decade(v) {
  if (!Number.isFinite(v) || v <= 0) return "--";
  const exponent = Math.floor(Math.log10(v));
  const mantissa = v / 10 ** exponent;
  return `${mantissa.toFixed(mantissa < 10 ? 1 : 0)}×${power(10 ** exponent)}`;
}

// A log ruler: a graduation at every 1 to 9 of each decade, so the
// spacing between them shows the scale is logarithmic and a point can
// be read off between labels.  uPlot's own splits label 1, 2 and 5 of
// each decade, which is what made the axis look busy -- the answer is
// fewer labels, not fewer graduations, so only the decades are named.
//
// A span too narrow to hold two decades keeps uPlot's own splits,
// rather than being given an axis with one mark on it.
function graduations(u, axis, min, max) {
  const first = Math.floor(Math.log10(min) - 1e-9);
  const last = Math.ceil(Math.log10(max) + 1e-9);
  const out = [];
  for (let e = first; e <= last; e++) {
    for (let m = 1; m < 10; m++) {
      const v = m * 10 ** e;
      if (v >= min * (1 - 1e-9) && v <= max * (1 + 1e-9)) out.push(v);
    }
  }
  return out.length > 1 ? out : null;
}

// The mantissa of a graduation, 1 to 9, as an integer.  Found from the
// rounded exponent rather than by dividing, because 1e-9 divided out
// does not land exactly on 1.
function mantissa(v) {
  const e = Math.floor(Math.log10(v) + 1e-9);
  return Math.round(v / 10 ** e);
}

// Both axes name 1, 2 and 5 in each decade: a curve spanning two
// decades has only three decade lines, and the reader is left
// counting grid lines to place 50 s or 2 × 10⁻¹⁰.  An axis spanning
// less than that has too few of those, and names every graduation.
function labels(splits, format) {
  const sparse = splits.filter((v) => [1, 2, 5].includes(mantissa(v)));
  const name = sparse.length >= 3 ? (v) => sparse.includes(v) : () => true;
  return splits.map((v) => (name(v) ? format(v) : null));
}

// A decade of sigma_y, which is dimensionless and always small.
// Written 10 to the power rather than as 1e-9, which is a programming
// language's spelling of a number rather than a physicist's.
const SUPERSCRIPT = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²",
                      3: "³", 4: "⁴", 5: "⁵", 6: "⁶",
                      7: "⁷", 8: "⁸", 9: "⁹" };
function power(v) {
  if (!Number.isFinite(v) || v <= 0) return "";
  const exponent = String(Math.floor(Math.log10(v) + 1e-9));
  const m = mantissa(v);
  return (m === 1 ? "" : `${m}×`) + "10" + [...exponent].map((c) => SUPERSCRIPT[c]).join("");
}

// A graduation as the number itself: 1, 2, 5, 10, 20, 50.  Past six figures
// the exponent is shorter than the number and just as readable.
function plain(v) {
  if (!Number.isFinite(v) || v <= 0) return "";
  const exponent = Math.floor(Math.log10(v) + 1e-9);
  const m = mantissa(v);
  return exponent < 6 ? String(m * 10 ** exponent) : `${m}e${exponent}`;
}

function seconds(v) {
  if (!Number.isFinite(v)) return "--";
  if (v >= 86400) return `${(v / 86400).toFixed(v < 864000 ? 1 : 0)} d`;
  if (v >= 3600) return `${(v / 3600).toFixed(1)} h`;
  if (v >= 60) return `${(v / 60).toFixed(1)} m`;
  return `${v.toFixed(v < 10 ? 2 : 0)} s`;
}

// The table's averaging times, always in seconds, never minutes or
// hours.
function inSeconds(v) {
  if (!Number.isFinite(v)) return "--";
  return `${v.toFixed(v < 10 ? 2 : 0)} s`;
}

// The tau axis, the same on both charts.
function tauAxis() {
  return {
    scale: "x",
    stroke: "#8b929c",
    grid: { stroke: "#2b3038" },
    label: "averaging time τ, seconds",
    labelSize: 28,
    font: AXIS_FONT,
    labelFont: AXIS_FONT,
    splits: graduations,
    // uPlot's own filter for a log axis keeps only the decades; which
    // graduations are named is decided in `values` instead.
    filter: (_, splits) => splits,
    values: (_, splits) => labels(splits, plain),
  };
}

function sigmaAxis(label) {
  return {
    scale: "y",
    stroke: "#8b929c",
    grid: { stroke: "#2b3038" },
    size: 72,
    label,
    labelSize: 28,
    font: AXIS_FONT,
    labelFont: AXIS_FONT,
    splits: graduations,
    filter: (_, splits) => splits,
    values: (_, splits) => labels(splits, power),
  };
}

// uPlot drags to zoom by default, and on two log axes it is easy to
// end up somewhere with no way back.  Double click returns to the
// whole curve, as it does on the history page.
function resettable(u) {
  u.over.addEventListener("dblclick", () => {
    u.setScale("x", { min: null, max: null });
    u.setScale("y", { min: null, max: null });
  });
}

// The one-sigma interval on each curve, drawn as a shaded band between
// its lower and upper bounds.  Painted by hand rather than as two more
// uPlot series with a fill between them: series appear in the legend
// and take a colour, and a band is not a curve.  `bands` maps a series
// index to its [lower, upper] arrays; a point without an interval is a
// break in the band, as it is in the line.
function shadeBands(bands) {
  return (u) => {
    const { ctx } = u;
    ctx.save();
    ctx.beginPath();
    ctx.rect(u.bbox.left, u.bbox.top, u.bbox.width, u.bbox.height);
    ctx.clip();
    for (const [idx, [lower, upper]] of Object.entries(bands)) {
      const series = u.series[Number(idx)];
      if (!series.show) continue;
      ctx.fillStyle = series.stroke() + "30";
      const xs = u.data[0];
      let run = [];
      const flush = () => {
        if (run.length < 2) {
          run = [];
          return;
        }
        ctx.beginPath();
        run.forEach(([x, hi], i) => {
          const px = u.valToPos(x, "x", true), py = u.valToPos(hi, "y", true);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        for (let i = run.length - 1; i >= 0; i--) {
          const [x, , lo] = run[i];
          ctx.lineTo(u.valToPos(x, "x", true), u.valToPos(lo, "y", true));
        }
        ctx.closePath();
        ctx.fill();
        run = [];
      };
      xs.forEach((x, i) => {
        if (lower[i] === null || upper[i] === null) flush();
        else run.push([x, upper[i], lower[i]]);
      });
      flush();
    }
    ctx.restore();
  };
}

const bound = (b, side) => (b ? b[side] : null);

// A y scale that ranges over the bands as well as the lines, padded
// a little, so a wide interval at long tau is not cut off at the
// axis.  uPlot ranges from the series alone; the shading is not one.
function sigmaScale(bands) {
  const values = Object.values(bands).flat(2).filter((v) => v !== null && v > 0);
  const lo = Math.min(...values), hi = Math.max(...values);
  return {
    ...LOG,
    range: (_, min, max) => [Math.min(min, lo) / 1.1, Math.max(max, hi) * 1.1],
  };
}

function draw(points) {
  for (const old of [chart, tdevChart]) {
    if (old) old.destroy();
  }
  chart = null;
  tdevChart = null;
  $("chart").innerHTML = "";
  $("chart-tdev").innerHTML = "";
  if (!points.length) {
    $("chart").innerHTML = `<p class="muted pad">nothing to plot in this range</p>`;
    return;
  }
  if (typeof uPlot === "undefined") {
    $("chart").innerHTML =
      `<p class="muted pad">the chart library did not load; the table has the numbers</p>`;
    return;
  }
  const size = { width: width(), height: 0 };
  size.height = height(size.width);
  // Two curves on the first chart.  The modified deviation is the one
  // this record supports exactly -- the receiver's reading is already
  // a ten-second mean, which is the innermost block of the modified
  // form's own averaging; the plain Allan deviation is kept because
  // data sheets quote that one.  Both are measured curves and both
  // are drawn at full strength, told apart by colour and legend: a
  // dashed or dimmed line reads as a reference or a fit.  A point
  // the modified form lacks (it needs three whole windows) is a hole
  // in its series, which uPlot leaves as a break in the line.
  const tau = points.map((p) => p.tau);
  const modified = points.map((p) => (p.modified ? p.modified.deviation : null));
  const time = points.map((p) => (p.modified ? p.modified.time : null));
  const mtie = points.map((p) => (p.mtie ? p.mtie.peak : null));
  const band = (pick) => [
    points.map((p) => bound(pick(p), "lower")),
    points.map((p) => bound(pick(p), "upper")),
  ];
  const sigmaBands = {
    1: band((p) => p.modified?.bounds),
    2: band((p) => p.bounds),
  };
  const timeBands = { 1: band((p) => p.modified?.time_bounds) };
  // uPlot's legend is a live cursor readout, which is worth having on
  // a curve whose points are decades apart and hard to read off an
  // axis; the symbols say these are the coordinates of the point
  // under the cursor.  The cursor is shared between the two charts.
  const cursor = { points: { size: 8 }, sync: { key: SYNC, setSeries: false } };
  chart = new uPlot(
    {
      width: size.width,
      height: size.height,
      title: "Stability of the 1 PPS against GPS, shaded to one sigma",
      scales: { x: TAU_SCALE, y: sigmaScale(sigmaBands) },
      axes: [tauAxis(), sigmaAxis("deviation σy")],
      series: [
        { label: "τ", value: (_, v) => seconds(v) },
        {
          label: "MDEV",
          stroke: "#38bdf8",
          width: 1.5,
          show: shown.has("MDEV"),
          points: { show: true, size: 5 },
          value: (_, v) => decade(v),
        },
        {
          label: "ADEV",
          stroke: "#a78bfa",
          width: 1.5,
          show: shown.has("ADEV"),
          points: { show: true, size: 5 },
          value: (_, v) => decade(v),
        },
      ],
      legend: { show: true, live: true },
      cursor,
      hooks: { setSeries: [followLegend(0)], draw: [shadeBands(sigmaBands)] },
    },
    [tau, modified, points.map((p) => p.deviation)],
    $("chart"),
  );
  resettable(chart);
  tdevChart = new uPlot(
    {
      width: size.width,
      height: Math.round(size.height * 0.6),
      title: "Time deviation, shaded to one sigma",
      scales: { x: TAU_SCALE, y: sigmaScale(timeBands) },
      axes: [tauAxis(), sigmaAxis("seconds")],
      series: [
        { label: "τ", value: (_, v) => seconds(v) },
        {
          label: "TDEV",
          stroke: "#f59e0b",
          width: 1.5,
          show: shown.has("TDEV"),
          points: { show: true, size: 5 },
          value: (_, v) => (Number.isFinite(v) ? `${decade(v)} s` : "--"),
        },
        {
          label: "MTIE",
          stroke: "#f87171",
          width: 1.5,
          show: shown.has("MTIE"),
          points: { show: true, size: 5 },
          value: (_, v) => (Number.isFinite(v) ? `${decade(v)} s` : "--"),
        },
      ],
      legend: { show: true, live: true },
      cursor,
      hooks: { setSeries: [followLegend(1)], draw: [shadeBands(timeBands)] },
    },
    [tau, time, mtie],
    $("chart-tdev"),
  );
  resettable(tdevChart);
}

// An interval as its two bounds; a dash where there is none, so an
// absence is not read as zero width.
const interval = (b) => (b ? `${esc(decade(b.lower))} – ${esc(decade(b.upper))}` : "--");

// The power law exponent as the name people know it by.
const NOISE = { 2: "W PM", 1: "F PM", 0: "W FM", "-1": "F FM", "-2": "RW FM" };
const noiseName = (alpha) => `${NOISE[alpha] ?? "?"} (α=${alpha})`;

function table(d) {
  if (!d.points.length) {
    $("table").innerHTML =
      `<tbody class="muted"><tr><td>` +
      `not enough unbroken readings here to measure anything` +
      `</td></tr></tbody>`;
    return;
  }
  $("table").innerHTML =
    "<thead><tr><th>averaging time</th>" +
    `<th title="modified Allan deviation: exact for these readings, ` +
    `which are already ten-second means">MDEV</th>` +
    `<th title="one-sigma interval on MDEV: chi-squared, with Greenhall's ` +
    `degrees of freedom for the noise type identified at this τ">MDEV 1σ</th>` +
    `<th title="time deviation, τ·MDEV/√3, in seconds">TDEV, s</th>` +
    `<th title="maximum time interval error: the largest peak-to-peak ` +
    `phase excursion in any window of τ, in seconds; a worst case, so one ` +
    `step sets it">MTIE, s</th>` +
    `<th title="overlapping Allan deviation, as data sheets quote it; ` +
    `a factor √10 low wherever phase noise dominates, because the readings ` +
    `are averaged">ADEV</th>` +
    `<th title="one-sigma interval on ADEV, as for MDEV">ADEV 1σ</th>` +
    `<th title="the power law dominating at this τ, by the lag 1 ` +
    `autocorrelation of the τ-sampled phase: α from +2, white PM, to −2, ` +
    `random walk FM; carried from the previous τ once too few readings ` +
    `remain to tell">noise</th>` +
    `<th title="how many estimates the MDEV figure averages; each needs ` +
    `three whole windows of consecutive readings, so a gap costs it more ` +
    `than ADEV">MDEV points</th>` +
    `<th title="how many second differences the ADEV figure averages; ` +
    `each needs three readings at the right spacing">ADEV points</th>` +
    "</tr></thead><tbody>" +
    d.points
      .map(
        (p) =>
          `<tr><td>${esc(inSeconds(p.tau))}</td>` +
          `<td>${p.modified ? esc(decade(p.modified.deviation)) : "--"}</td>` +
          `<td class="muted">${interval(p.modified?.bounds)}</td>` +
          `<td>${p.modified ? esc(decade(p.modified.time)) : "--"}</td>` +
          `<td>${p.mtie ? esc(decade(p.mtie.peak)) : "--"}</td>` +
          `<td>${esc(decade(p.deviation))}</td>` +
          `<td class="muted">${interval(p.bounds)}</td>` +
          `<td class="muted">${p.noise === null ? "--" : esc(noiseName(p.noise))}</td>` +
          `<td class="muted">${p.modified ? p.modified.averages : "--"}</td>` +
          `<td class="muted">${p.differences}</td></tr>`,
      )
      .join("") +
    "</tbody>";
}

// Which load is the latest.  A long range can take longer to measure
// than a short one asked for after it, and the slower answer must not
// land on top of the one the reader is now looking at.
let latest = 0;

async function load() {
  const mine = ++latest;
  $("state").innerHTML = `<span class="pill">measuring...</span>`;
  const q = new URLSearchParams();
  const { from, to } = rangeBounds();
  q.set("from", String(Math.floor(from)));
  q.set("to", String(Math.ceil(to ?? 2000000000)));
  try {
    const r = await fetch(`/api/adev?${withUnit(q)}`);
    if (!r.ok) throw new Error(`the server answered ${r.status}`);
    const d = await r.json();
    if (mine !== latest) return;
    // A failure the server could describe comes back as 200 with an
    // error in it, not as an HTTP status.
    if (d.error) throw new Error(d.error);
    draw(d.points);
    table(d);
    // Coverage travels with the curve because the curve cannot show
    // it: one drawn from a run that is mostly holes, or that broke into
    // forty pieces, looks exactly like one drawn from a clean day.
    const total = d.present + d.holes;
    const complete = total ? ((100 * d.present) / total).toFixed(1) : "0.0";
    const stat = (v, k) =>
      `<span class="stat"><span class="v">${esc(v)}</span>` +
      `<span class="k">${esc(k)}</span></span>`;
    $("state").innerHTML =
      stat(d.present, "readings") +
      stat(seconds(d.tau0), "spacing") +
      stat(d.segments, "unbroken runs") +
      stat(`${complete}%`, "complete") +
      stat(d.holes, "holes") +
      (d.truncated
        ? ` <span class="pill stale">longer than one measurement reads; this is its newest part</span>`
        : "");
  } catch (e) {
    if (mine !== latest) return;
    draw([]);
    table({ points: [] });
    $("state").innerHTML = `<span class="pill down">${esc(e.message)}</span>`;
  }
}

rangeControl($("ranges"), load);

// Said once, plainly, because the number on the chart is not the number
// most people come looking for.
$("caveat").textContent =
  "The interval measured is between the 1 PPS from the GPS receiver, " +
  "which is quantized to that receiver's own crystal, and a 1 PPS " +
  "divided down from the OCXO. While locked, the OCXO is steered to " +
  "follow it. Each reading is the receiver's own mean of ten seconds, " +
  "which the modified deviation absorbs exactly and the plain Allan " +
  "deviation does not: wherever the receiver's phase noise dominates, " +
  "the plain deviation of these means sits a factor √10 below that of " +
  "the 1 PPS itself. The shading is the one-sigma interval on each " +
  "curve, from chi-squared statistics with Greenhall's degrees of " +
  "freedom for the noise type found at each τ by the lag 1 " +
  "autocorrelation method (NIST SP 1065, sections 5.3 to 5.5). It is " +
  "the estimator's own uncertainty, and says nothing about the √10.";

addEventListener("resize", () => {
  if (!chart) return;
  const w = width();
  chart.setSize({ width: w, height: height(w) });
  if (tdevChart) tdevChart.setSize({ width: w, height: Math.round(height(w) * 0.6) });
});

picker();
chooseReceiver(load).then(load);
</script>
