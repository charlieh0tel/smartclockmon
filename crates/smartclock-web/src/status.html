<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartClock status</title>

<link rel="stylesheet" href="/style.css">

<div class="panel" id="status"><span class="muted">connecting...</span></div>

<nav class="panel nav">
  <a href="/">Live</a>
  <a href="/status" aria-current="page">Status</a>
  <a href="/adev">Stability</a>
  <a href="/compare">Compare</a>
  <a href="/correlation">Correlation</a>
</nav>

<div class="panel" id="unit-bar" hidden>
  <div class="controls">
    <label for="unit">Receiver</label>
    <select id="unit"></select>
    <span class="grow"></span>
    <span id="unit-seen" class="muted"></span>
  </div>
</div>

<div class="panel banner" id="cost"></div>

<div class="panel" id="state"><span class="muted">idle</span></div>

<div class="panel">
  <div class="controls">
    <h2>Status</h2>
    <span class="grow"></span>
    <label for="live">live</label>
    <input type="checkbox" id="live">
    <button id="read">read</button>
  </div>
  <div id="status-panes">
    <pre id="screen" class="muted">nothing read yet</pre>
    <div id="sky-pane">
      <canvas id="sky" width="320" height="320"></canvas>
    </div>
  </div>
</div>

<footer id="colophon"></footer>

<script src="/common.js"></script>
<script>
// Everything interpolated into innerHTML goes through this: the values
// come from a string scraper over a serial line.

// How often a live status view re-reads, in milliseconds.
//
// Each read costs the receiver about 1.5 s of its serial link -- four
// fast polls -- so this is deliberately slower than the fast and medium
// tiers, and off unless someone turns it on.
const LIVE_PERIOD = 15000;

// Sizes below are for a plot this many pixels across, and scale with it.
const DESIGN_SIZE = 320;
const MARGIN = 20;      // room for the cardinal labels and a rim dot
const LABEL_PX = 11;    // label text
const SKY_GRID = "#39414f";
const SKY_HORIZON = "#515b6b";
const DOT_MIN = 4;      // a satellite with no signal reading
const DOT_RANGE = 7;    // added at the strongest signal in the frame

// The last screen drawn, so a resized window can redraw the plot at its
// new size without costing the receiver another read.
let shown = null;

// ------------------------------------------------------------------ sky

// A polar plot of what the receiver can see: north up, horizon at the
// rim, zenith at the middle.  This is the view the status screen's
// table implies and never shows.  Drawn at the size the page gives it,
// in device pixels, so it stays sharp when it grows to the screen's
// height, with its labels and dots growing in proportion.
function sky(screen) {
  const c = $("sky"), ctx = c.getContext("2d");
  const side = c.clientWidth, dpr = window.devicePixelRatio || 1;
  const k = side / DESIGN_SIZE;
  c.width = c.height = Math.round(side * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = side, h = side, cx = w / 2, cy = h / 2, r = Math.min(cx, cy) - MARGIN * k;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#c2c8d2";
  ctx.font = `${LABEL_PX * k}px ui-monospace, monospace`;
  ctx.textAlign = "center";

  // Elevation rings at 30 degree steps, the horizon last and brighter
  // so the edge of the plot reads as an edge.
  for (const elev of [60, 30, 0]) {
    ctx.strokeStyle = elev === 0 ? SKY_HORIZON : SKY_GRID;
    ctx.beginPath();
    ctx.arc(cx, cy, (r * (90 - elev)) / 90, 0, 2 * Math.PI);
    ctx.stroke();
  }
  ctx.strokeStyle = SKY_GRID;
  for (const [deg, name] of [[0, "N"], [90, "E"], [180, "S"], [270, "W"]]) {
    const a = ((deg - 90) * Math.PI) / 180;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    ctx.stroke();
    const out = r + (MARGIN / 2) * k;
    ctx.fillText(name, cx + out * Math.cos(a), cy + out * Math.sin(a) + (LABEL_PX / 3) * k);
  }

  const signals = (screen?.satellites ?? [])
    .map((s) => s.signal)
    .filter((v) => v != null && v > 0);
  const strongest = signals.length ? Math.max(...signals) : 0;

  for (const sat of screen?.satellites ?? []) {
    // Below the horizon, or a reading the scraper could not make sense
    // of: either would land outside the plot.
    if (
      !Number.isFinite(sat.elevation) ||
      !Number.isFinite(sat.azimuth) ||
      sat.elevation < 0
    ) {
      continue;
    }
    const a = (sat.azimuth - 90) * Math.PI / 180;
    const d = r * (90 - sat.elevation) / 90;
    const x = cx + d * Math.cos(a), y = cy + d * Math.sin(a);
    // Scaled to the strongest satellite in this frame, because the
    // receiver's own scale is undocumented and differs between models
    // -- one reports 0 to 9, another 0 to 49.  Dividing by a fixed 255
    // made every dot the same size, which is what this looked like
    // before anyone measured it.
    const size =
      sat.signal == null || !strongest
        ? DOT_MIN * k
        : (DOT_MIN + (sat.signal / strongest) * DOT_RANGE) * k;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, 2 * Math.PI);
    ctx.fillStyle = sat.tracked ? "#4ade80" : sat.acquiring ? "#fbbf24" : "#6b7280";
    ctx.fill();
    ctx.fillStyle = "#e6e8eb";
    ctx.textAlign = x < cx ? "right" : "left";
    const gap = size + (LABEL_PX / 4) * k;
    ctx.fillText(sat.prn, x + (x < cx ? -gap : gap), y + (LABEL_PX / 3) * k);
    ctx.textAlign = "center";
  }
}

// -------------------------------------------------------------- screen

// The screen as the receiver sent it.  textContent, not innerHTML, so
// nothing in it is ever read as markup.
function screen(s) {
  const pre = $("screen");
  pre.textContent = s?.text || "no status screen";
  pre.classList.toggle("muted", !s?.text);
}

// The plot grows to the screen's height and no further, so the two
// columns end together at any font size.  Beside the screen it shrinks
// to what is left of the row; stacked under it on a narrow window it
// takes the width, up to the same size.
function fit() {
  $("sky-pane").style.maxWidth = `${$("screen").offsetHeight}px`;
  sky(shown);
}

// ---------------------------------------------------------------- read

// How long a screen read may take: 1.5 s of link, behind whatever the
// daemon was already doing.
const READ_TIMEOUT = 20000;

content({
  daemon: true,
  every: LIVE_PERIOD,
  auto: () => $("live").checked,
  // The sky is cleared, not left up: a canvas still showing eight
  // tracked satellites beside the words "no daemon" asserts a sky the
  // receiver may not have, which is the one stale value a GPS tool
  // must not show.
  clear(why, bad) {
    shown = null;
    $("screen").textContent = bad ? "no status screen" : why;
    $("screen").classList.add("muted");
    fit();
    $("state").innerHTML = pill(why, bad);
  },
  async load(signal) {
    $("read").disabled = true;
    $("state").innerHTML = pill("reading the status screen...");
    try {
      const s = await ask("/api/status" + liveQuery(), signal, READ_TIMEOUT);
      if (!s.screen) throw new Error("the daemon answered with no status screen");
      shown = s.screen;
      screen(s.screen);
      fit();
      $("state").innerHTML =
        `<span class="pill ok">read at ${esc(new Date().toLocaleTimeString())}</span>` +
        (s.screen.satellites_suspect
          ? ` <span class="pill stale">the table disagrees with its own counts</span>`
          : "");
    } finally {
      $("read").disabled = false;
    }
  },
});

// Said on the page because nothing else shows it: the log looks
// complete, with a hole wherever this page read.
$("cost").textContent =
  `Each read holds the receiver's link for about 1.5 s, leaving a gap in its ` +
  `once-a-second log; "live" reads every ${LIVE_PERIOD / 1000} s. ` +
  `The daemon also reads the screen itself every --sky seconds (300 by ` +
  `default). Leave this page for 1 Hz data with no other gaps.`;

$("read").onclick = () => renew(true);
window.addEventListener("resize", fit);
$("live").onchange = () => {
  if ($("live").checked) refresh();
};
</script>
